name: Post-Merge LEARN Bootstrap

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  dispatch_learn_source:
    name: Human Merge → Trusted LEARN Source
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write

    steps:
      - name: exact MERGE_READY / Trusted Rail provenance 선택
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = context.payload.repository;
            const body = pr.body || '';
            const mergeReady = body.match(
              /<!-- ai-dev-framework:MERGE_READY issue=([1-9]\d*) reviewed-sha=([0-9a-f]{40}) -->/,
            );

            if (!mergeReady) {
              core.info('Framework MERGE_READY PR이 아니므로 post-merge LEARN을 시작하지 않습니다');
              core.setOutput('should_run', 'false');
              return;
            }

            const issueNumber = Number(mergeReady[1]);
            const reviewedSha = mergeReady[2];
            if (
              pr.base.ref !== repository.default_branch ||
              pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pr.head.ref !== `ai-publish/issue-${issueNumber}` ||
              pr.head.sha !== reviewedSha
            ) {
              core.setFailed('merged Human Merge PR exact identity mismatch');
              return;
            }

            const trusted = body.match(
              /<!-- ai-dev-framework:TRUSTED_RAIL run-id=([1-9]\d*) run-attempt=([1-9]\d*) orchestration-artifact=([^\s>]+) -->/,
            );
            if (!trusted) {
              core.setFailed('MERGE_READY PR에 exact Trusted Rail provenance marker가 없습니다');
              return;
            }

            const trustedRailRunId = Number(trusted[1]);
            const trustedRailRunAttempt = Number(trusted[2]);
            const orchestrationArtifactName = trusted[3];
            const expectedArtifact =
              `orchestration-provenance-issue-${issueNumber}-${trustedRailRunId}-attempt-${trustedRailRunAttempt}`;
            if (orchestrationArtifactName !== expectedArtifact) {
              core.setFailed('Trusted Rail orchestration artifact name mismatch');
              return;
            }

            const { data: trustedRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: trustedRailRunId,
            });
            if (
              trustedRun.run_attempt !== trustedRailRunAttempt ||
              trustedRun.status !== 'completed' ||
              trustedRun.conclusion !== 'success' ||
              trustedRun.path !== '.github/workflows/trusted-rail.yml' ||
              trustedRun.head_branch !== repository.default_branch
            ) {
              core.setFailed('Trusted Rail source run identity/status mismatch');
              return;
            }

            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: trustedRailRunId,
              per_page: 100,
            });
            const orchestrationArtifacts = artifactData.artifacts.filter(
              (artifact) =>
                !artifact.expired &&
                artifact.name === orchestrationArtifactName &&
                /^sha256:[0-9a-f]{64}$/.test(artifact.digest || ''),
            );
            if (orchestrationArtifacts.length !== 1) {
              core.setFailed(
                `expected one exact orchestration artifact, found ${orchestrationArtifacts.length}`,
              );
              return;
            }

            core.setOutput('should_run', 'true');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('reviewed_sha', reviewedSha);
            core.setOutput('human_merge_pr_number', String(pr.number));
            core.setOutput('trusted_rail_run_id', String(trustedRailRunId));
            core.setOutput('trusted_rail_run_attempt', String(trustedRailRunAttempt));
            core.setOutput('orchestration_artifact_name', orchestrationArtifactName);

      - name: exact Orchestration provenance 다운로드
        if: steps.source.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.orchestration_artifact_name }}
          path: ${{ runner.temp }}/post-merge-orchestration
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.trusted_rail_run_id }}

      - name: requirement completion exact 검증
        id: completion
        if: steps.source.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          REQUIREMENT_ISSUE_NUMBER: ${{ steps.source.outputs.issue_number }}
          REVIEWED_SHA: ${{ steps.source.outputs.reviewed_sha }}
          HUMAN_MERGE_PR_NUMBER: ${{ steps.source.outputs.human_merge_pr_number }}
          ORCHESTRATION_DIR: ${{ runner.temp }}/post-merge-orchestration
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const issueNumber = Number(process.env.REQUIREMENT_ISSUE_NUMBER);
            const reviewedSha = process.env.REVIEWED_SHA;
            const prNumber = Number(process.env.HUMAN_MERGE_PR_NUMBER);
            const root = process.env.ORCHESTRATION_DIR;

            const files = [];
            const visit = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) visit(full);
                else files.push(full);
              }
            };
            visit(root);
            if (files.length !== 1 || path.basename(files[0]) !== 'orchestration.json') {
              core.setFailed(`orchestration artifact must contain exactly orchestration.json; files=${files.length}`);
              return;
            }

            const provenance = JSON.parse(fs.readFileSync(files[0], 'utf8'));
            if (
              provenance.type !== 'ORCHESTRATION' ||
              provenance.repository !== `${context.repo.owner}/${context.repo.repo}` ||
              provenance.issueNumber !== issueNumber ||
              provenance.decision !== 'PASS' ||
              provenance.nextState !== 'MERGE_READY' ||
              typeof provenance.requirementComplete !== 'boolean' ||
              provenance.reviewedHeadSha !== reviewedSha ||
              provenance.mergeBoundary?.type !== 'HUMAN_PULL_REQUEST' ||
              provenance.mergeBoundary?.number !== prNumber ||
              provenance.mergeBoundary?.headSha !== reviewedSha
            ) {
              core.setFailed('Orchestration provenance completion/merge identity mismatch');
              return;
            }

            core.setOutput('requirement_complete', String(provenance.requirementComplete));
            core.info(`trusted requirementComplete=${provenance.requirementComplete}`);

      - name: 미완료 업무 요구 다음 PLAN 자동 시작
        if: >-
          steps.source.outputs.should_run == 'true' &&
          steps.completion.outputs.requirement_complete == 'false'
        uses: actions/github-script@v7
        env:
          REQUIREMENT_ISSUE_NUMBER: ${{ steps.source.outputs.issue_number }}
        with:
          script: |
            // Post-Merge workflow 자체 rerun으로 PLAN AI 비용이 중복되지 않게 initial attempt에서만 dispatch한다.
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (runAttempt !== 1) {
              core.info(`AI Cost Guardrail: post-merge rerun attempt ${runAttempt}에서는 continuation PLAN을 중복 호출하지 않습니다`);
              return;
            }

            const issueNumber = Number(process.env.REQUIREMENT_ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('invalid continuation requirement issue number');
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request || issue.state !== 'open') {
              core.setFailed(`incomplete requirement must remain open before continuation PLAN: state=${issue.state}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'plan.yml',
              ref: context.payload.repository.default_branch,
              inputs: { issue_number: String(issueNumber) },
            });
            core.info(`requirement #${issueNumber} is incomplete; dispatched next Read-only AI PLAN`);

      - name: Trusted LEARN Source 자동 시작
        if: steps.source.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          REQUIREMENT_ISSUE_NUMBER: ${{ steps.source.outputs.issue_number }}
          HUMAN_MERGE_PR_NUMBER: ${{ steps.source.outputs.human_merge_pr_number }}
          TRUSTED_RAIL_RUN_ID: ${{ steps.source.outputs.trusted_rail_run_id }}
          TRUSTED_RAIL_RUN_ATTEMPT: ${{ steps.source.outputs.trusted_rail_run_attempt }}
          ORCHESTRATION_ARTIFACT_NAME: ${{ steps.source.outputs.orchestration_artifact_name }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'learn-source.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                requirement_issue_number: process.env.REQUIREMENT_ISSUE_NUMBER,
                human_merge_pr_number: process.env.HUMAN_MERGE_PR_NUMBER,
                trusted_rail_run_id: process.env.TRUSTED_RAIL_RUN_ID,
                trusted_rail_run_attempt: process.env.TRUSTED_RAIL_RUN_ATTEMPT,
                orchestration_artifact_name: process.env.ORCHESTRATION_ARTIFACT_NAME,
              },
            });
            core.info('Trusted LEARN Source를 자동 dispatch했습니다');
