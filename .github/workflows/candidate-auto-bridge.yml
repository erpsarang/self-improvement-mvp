name: LEARN Completed Candidate Bridge

on:
  workflow_run:
    workflows: ["Read-only AI LEARN"]
    types: [completed]

permissions: {}

jobs:
  dispatch_candidate:
    name: completed LEARN → Trusted Improvement Candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: exact LEARN report artifact 선택
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (
              run.path !== '.github/workflows/learn.yml' ||
              run.status !== 'completed' ||
              run.conclusion !== 'success' ||
              run.head_branch !== context.payload.repository.default_branch
            ) {
              core.setFailed('Read-only AI LEARN completed-success identity mismatch');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: run.id,
              per_page: 100,
            });
            const pattern = new RegExp(
              `^learn-report-issue-[1-9]\\d*-pr-[1-9]\\d*-${run.id}-attempt-${run.run_attempt}$`,
            );
            const reports = data.artifacts.filter(
              (artifact) =>
                !artifact.expired &&
                pattern.test(artifact.name) &&
                /^sha256:[0-9a-f]{64}$/.test(artifact.digest || ''),
            );
            if (reports.length !== 1) {
              core.setFailed(`expected one exact LEARN report artifact, found ${reports.length}`);
              return;
            }

            core.setOutput('learn_run_id', String(run.id));
            core.setOutput('learn_run_attempt', String(run.run_attempt));
            core.setOutput('learn_report_artifact_name', reports[0].name);

      - name: exact LEARN report 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.report.outputs.learn_report_artifact_name }}
          path: ${{ runner.temp }}/learn-report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.report.outputs.learn_run_id }}

      - name: report embedded source identity 추출
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find "${RUNNER_TEMP}/learn-report" -type f -print)
          if [ "${#files[@]}" -ne 1 ] || [ "$(basename "${files[0]}")" != "learn-report.json" ]; then
            echo "LEARN report artifact must contain exactly learn-report.json" >&2
            exit 1
          fi
          REPORT="${files[0]}"
          node --input-type=module - "$REPORT" "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const [reportPath, outputPath] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const source = report?.source?.inputPack;
          const runId = source?.sourceRun?.runId;
          const runAttempt = source?.sourceRun?.runAttempt;
          const artifactName = source?.artifact?.name;
          if (!Number.isSafeInteger(runId) || runId <= 0 ||
              !Number.isSafeInteger(runAttempt) || runAttempt <= 0 ||
              typeof artifactName !== 'string' ||
              !/^learn-input-issue-[1-9]\d*-pr-[1-9]\d*-record-[0-9a-f]{64}$/.test(artifactName)) {
            throw new Error('LEARN report embedded input-pack source identity is invalid');
          }
          appendFileSync(outputPath, `source_run_id=${runId}\n`);
          appendFileSync(outputPath, `source_run_attempt=${runAttempt}\n`);
          appendFileSync(outputPath, `learn_input_artifact_name=${artifactName}\n`);
          NODE

      - name: Trusted Improvement Candidate 자동 시작
        uses: actions/github-script@v7
        env:
          LEARN_RUN_ID: ${{ steps.report.outputs.learn_run_id }}
          LEARN_RUN_ATTEMPT: ${{ steps.report.outputs.learn_run_attempt }}
          LEARN_REPORT_ARTIFACT_NAME: ${{ steps.report.outputs.learn_report_artifact_name }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          LEARN_INPUT_ARTIFACT_NAME: ${{ steps.source.outputs.learn_input_artifact_name }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'improvement-candidate.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                learn_run_id: process.env.LEARN_RUN_ID,
                learn_run_attempt: process.env.LEARN_RUN_ATTEMPT,
                learn_report_artifact_name: process.env.LEARN_REPORT_ARTIFACT_NAME,
                source_run_id: process.env.SOURCE_RUN_ID,
                source_run_attempt: process.env.SOURCE_RUN_ATTEMPT,
                learn_input_artifact_name: process.env.LEARN_INPUT_ARTIFACT_NAME,
              },
            });
            core.info('Trusted Improvement Candidate를 자동 dispatch했습니다');
