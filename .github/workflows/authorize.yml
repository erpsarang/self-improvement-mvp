name: Trusted AUTHORIZE

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: authorize-${{ github.event.issue.number }}

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == 'SI-승인'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trusted AUTHORIZE 기록
        run: npm exec -- tsx src/self-improvement/authorize-handler.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
