name: Trusted Product Evaluation

# 사람이 실행할 때만 지금 배포된 App을 제품 관점에서 한 번 살펴보고(Product Discovery),
# 서로 다른 영역의 후보 3개를 비교해 1위가 충분히 가치 있을 때만 App repository에 Improvement Candidate Issue를 만든다.
# 머지 후 자동 실행은 하지 않는다.
#
# 경계:
# - 한 실행당 Improvement Candidate 최대 1개
# - 기존 Issue와 중복이면 생성 금지
# - Framework 자체 개선 후보는 생성 금지
# - AI 호출은 실행당 1회, 재시도 없음. Evaluator는 Private subscription executor(Claude Max, opus)다
# - 교환 comment와 사람이 읽을 결과는 Discovery 전용 Issue 하나에 계속 남긴다
# - 생성한 Issue는 proposal이다. read-only AI PLAN은 자동으로 한 번 시작되지만 구현은 사람의 PLAN-승인 이후에만 진행된다
# - Auto Merge를 사용하지 않고 최종 Merge는 Human-only다
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: product-evaluation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discovery_issue:
    name: Discovery 전용 Issue 확보
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}

    steps:
      - name: Discovery 전용 Issue를 찾거나 처음 한 번 만든다
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            // Framework가 만든 열린 Discovery Issue 하나만 계속 쓴다. 사람이 닫으면 다음 실행에서 새로 만든다.
            const title = '[Product Discovery] 실행 기록';
            const marker = '<!-- ai-dev-framework:PRODUCT_DISCOVERY_LOG v=1 -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const found = open.filter((issue) =>
              !issue.pull_request &&
              issue.user?.login === 'github-actions[bot]' &&
              issue.title === title &&
              (issue.body || '').startsWith(marker)
            );
            if (found.length > 1) {
              throw new Error(`열린 Discovery Issue가 여러 개입니다: ${found.map((issue) => `#${issue.number}`).join(', ')}. 하나만 남기고 닫아 주세요`);
            }
            let issueNumber = found[0]?.number;
            if (issueNumber === undefined) {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo,
                title,
                body: [
                  marker,
                  '사람이 Actions에서 `Trusted Product Evaluation`을 실행할 때마다 Product Discovery 요청·결과와 판단 요약을 이 Issue에 남깁니다.',
                  '이 Issue는 기록용입니다. 여기에 PLAN을 요청하지 마세요. 닫으면 다음 실행에서 새 기록 Issue를 만듭니다.',
                ].join('\n\n'),
              });
              issueNumber = issue.number;
              core.info(`Discovery 전용 Issue #${issueNumber}를 만들었습니다`);
            }
            core.setOutput('issue_number', String(issueNumber));

  prepare:
    name: trusted 제품 snapshot 생성
    needs: discovery_issue
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      snapshot_digest: ${{ steps.prepare.outputs.snapshot_digest }}
      file_count: ${{ steps.prepare.outputs.file_count }}
      request_artifact_name: ${{ steps.names.outputs.request_artifact_name }}
      request_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      request_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      subscription_request_artifact_name: ${{ steps.names.outputs.subscription_request_artifact_name }}
      subscription_request_artifact_id: ${{ steps.subscription_upload.outputs.artifact-id }}
      subscription_request_artifact_digest: ${{ steps.subscription_upload.outputs.artifact-digest }}

    steps:
      - name: 실행 시점 기본 브랜치 SHA와 Discovery Issue 고정
        uses: actions/github-script@v7
        env:
          DISCOVERY_ISSUE_NUMBER: ${{ needs.discovery_issue.outputs.issue_number }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const raw = process.env.DISCOVERY_ISSUE_NUMBER || '';
            if (!/^[1-9]\d*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('Discovery Issue number must be a positive integer');
            }

            // 평가 대상은 특정 PR이 아니라 실행 시점에 배포된 기본 브랜치다.
            const { data: repository } = await github.rest.repos.get(context.repo);
            const { data: currentDefault } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: repository.default_branch,
            });
            if (context.ref !== `refs/heads/${repository.default_branch}` || context.sha !== currentDefault.commit.sha) {
              throw new Error('Trusted Product Evaluation must execute at the exact current default branch SHA');
            }

            const output = path.join(process.env.RUNNER_TEMP, 'product-evaluation');
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(
              path.join(output, 'target.json'),
              JSON.stringify({
                repository: `${context.repo.owner}/${context.repo.repo}`,
                discoveryIssueNumber: Number(raw),
                deployedSha: currentDefault.commit.sha,
              }, null, 2),
            );

      - name: 사람이 기각한 후보 수집
        uses: actions/github-script@v7
        env:
          REJECTED_CANDIDATES_JSON: ${{ runner.temp }}/product-evaluation/rejected-candidates.json
        with:
          script: |
            const fs = require('node:fs');
            const prefix = '[Self-Improvement]';
            const maxCandidates = 16;
            const maxReasonBytes = 1024;
            const bounded = (text) => {
              let value = String(text || '').trim();
              while (Buffer.byteLength(value, 'utf8') > maxReasonBytes) value = value.slice(0, -1);
              return value;
            };
            const rejected = [];
            // not_planned로 닫힌 Improvement Candidate만 기각 후보다. 사람이 남긴 마지막 코멘트를 사유로 읽는다.
            for (let page = 1; page <= 5 && rejected.length < maxCandidates; page += 1) {
              const { data } = await github.rest.issues.listForRepo({
                ...context.repo,
                state: 'closed',
                sort: 'created',
                direction: 'desc',
                per_page: 100,
                page,
              });
              for (const issue of data) {
                if (rejected.length >= maxCandidates) break;
                if (issue.pull_request || !issue.title.startsWith(prefix) || issue.state_reason !== 'not_planned') continue;
                const { data: comments } = await github.rest.issues.listComments({
                  ...context.repo,
                  issue_number: issue.number,
                  per_page: 100,
                });
                const human = comments.filter((comment) => comment.user?.login !== 'github-actions[bot]').pop();
                rejected.push({ issueNumber: issue.number, title: issue.title, reason: bounded(human?.body) });
              }
              if (data.length < 100) break;
            }
            fs.writeFileSync(process.env.REJECTED_CANDIDATES_JSON, JSON.stringify(rejected, null, 2));
            core.info(`기각된 후보 ${rejected.length}건을 평가 입력에 포함합니다`);

      - name: 최근 이력 수집 (완료한 요구와 최근 변경 경로)
        uses: actions/github-script@v7
        env:
          COMPLETED_REQUIREMENTS_JSON: ${{ runner.temp }}/product-evaluation/completed-requirements.json
          RECENT_CHANGED_PATHS_JSON: ${{ runner.temp }}/product-evaluation/recent-changed-paths.json
        with:
          script: |
            const fs = require('node:fs');
            const maxCompleted = 16;
            const maxTitleBytes = 160;
            const recentPullRequests = 10;
            const bounded = (text) => {
              let value = String(text || '').replace(/\s+/g, ' ').trim();
              while (Buffer.byteLength(value, 'utf8') > maxTitleBytes) value = value.slice(0, -1);
              return value.trim();
            };

            // 완료(completed)로 닫힌 Issue는 이미 끝난 요구다. 최근에 닫힌 것부터 읽는다.
            const completed = [];
            for (let page = 1; page <= 5 && completed.length < maxCompleted; page += 1) {
              const { data } = await github.rest.issues.listForRepo({
                ...context.repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
                page,
              });
              for (const issue of data) {
                if (completed.length >= maxCompleted) break;
                // 닫힌 Discovery 기록 Issue는 요구가 아니다.
                if (issue.pull_request || issue.state_reason !== 'completed' || issue.title === '[Product Discovery] 실행 기록') continue;
                const title = bounded(issue.title);
                if (title) completed.push({ issueNumber: issue.number, title });
              }
              if (data.length < 100) break;
            }

            // 최근 머지된 PR들이 바꾼 경로. 제품 경로만 남기는 일은 trusted handler가 결정적으로 한다.
            const { data: repository } = await github.rest.repos.get(context.repo);
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'closed',
              base: repository.default_branch,
              sort: 'updated',
              direction: 'desc',
              per_page: 50,
            });
            const merged = pulls
              .filter((pull) => pull.merged_at)
              .sort((left, right) => Date.parse(right.merged_at) - Date.parse(left.merged_at))
              .slice(0, recentPullRequests);
            const recentChangedPaths = [];
            for (const pull of merged) {
              const { data: files } = await github.rest.pulls.listFiles({
                ...context.repo,
                pull_number: pull.number,
                per_page: 100,
              });
              recentChangedPaths.push(...files.map((file) => file.filename));
            }

            fs.writeFileSync(process.env.COMPLETED_REQUIREMENTS_JSON, JSON.stringify(completed, null, 2));
            fs.writeFileSync(process.env.RECENT_CHANGED_PATHS_JSON, JSON.stringify(recentChangedPaths, null, 2));
            core.info(`완료한 요구 ${completed.length}건, 최근 머지 PR ${merged.length}개의 변경 경로를 입력에 포함합니다`);

      - name: trusted control-plane checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: evaluation-control

      - name: 배포된 제품 checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: product-target

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Framework runtime 의존성 설치
        working-directory: evaluation-control
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .framework-runtime/package-lock.json ]; then
            npm ci --ignore-scripts --prefix .framework-runtime
            ln -sT .framework-runtime/node_modules node_modules
          else
            npm ci --ignore-scripts
          fi

      - name: 제품 snapshot과 Discovery 요청 생성
        id: prepare
        working-directory: evaluation-control
        run: node_modules/.bin/tsx src/self-improvement/product-evaluation-handler.ts prepare
        env:
          PRODUCT_DISCOVERY_TARGET_JSON: ${{ runner.temp }}/product-evaluation/target.json
          PRODUCT_TARGET_ROOT: ${{ github.workspace }}/product-target
          REJECTED_CANDIDATES_JSON: ${{ runner.temp }}/product-evaluation/rejected-candidates.json
          COMPLETED_REQUIREMENTS_JSON: ${{ runner.temp }}/product-evaluation/completed-requirements.json
          RECENT_CHANGED_PATHS_JSON: ${{ runner.temp }}/product-evaluation/recent-changed-paths.json
          PRODUCT_EVALUATION_RUNTIME_DIR: ${{ runner.temp }}/product-evaluation/request
          PRODUCT_EVALUATION_SUBSCRIPTION_DIR: ${{ runner.temp }}/product-evaluation/subscription-request

      # 요청 식별 정보와 artifact 이름은 이 실행 run과 평가한 SHA로 정한다.
      - name: 평가 요청 artifact 이름 고정
        id: names
        shell: bash
        run: |
          set -euo pipefail
          echo "request_artifact_name=product-discovery-request-${GITHUB_SHA}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "subscription_request_artifact_name=product-discovery-subscription-${GITHUB_SHA}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: trusted 평가 요청 저장
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.request_artifact_name }}
          path: ${{ runner.temp }}/product-evaluation/request
          if-no-files-found: error

      - name: Product Evaluation AI 비용 상한 확인
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "AI Cost Guardrail: 동일 Product Evaluation run의 AI 호출은 최대 1 attempt만 허용합니다." >&2
            exit 1
          fi

      - name: PRODUCT_EVALUATION_REQUEST artifact 저장
        id: subscription_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.subscription_request_artifact_name }}
          path: ${{ runner.temp }}/product-evaluation/subscription-request
          if-no-files-found: error

  evaluator:
    name: Product Discovery subscription 교환
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/subscription-exchange.yml
    with:
      kind: PRODUCT_EVALUATION
      label: Product Discovery ${{ github.sha }}
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      request_artifact_name: ${{ needs.prepare.outputs.subscription_request_artifact_name }}
      request_artifact_id: ${{ needs.prepare.outputs.subscription_request_artifact_id }}
      request_artifact_digest: ${{ needs.prepare.outputs.subscription_request_artifact_digest }}
      result_artifact_name: evaluator-output-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      result_file_name: evaluator.json
    secrets:
      EXECUTOR_DISPATCH_TOKEN: ${{ secrets.EXECUTOR_DISPATCH_TOKEN }}

  finalize:
    name: trusted 검증과 Improvement Candidate Issue 결정
    needs: [prepare, evaluator]
    if: needs.prepare.result == 'success' && needs.evaluator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write

    steps:
      - name: trusted control-plane checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: evaluation-control

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Framework runtime 의존성 설치
        working-directory: evaluation-control
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .framework-runtime/package-lock.json ]; then
            npm ci --ignore-scripts --prefix .framework-runtime
            ln -sT .framework-runtime/node_modules node_modules
          else
            npm ci --ignore-scripts
          fi

      - name: trusted 평가 요청 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.request_artifact_name }}
          path: ${{ runner.temp }}/product-evaluation-request

      - name: untrusted Evaluator output 다운로드
        uses: actions/download-artifact@v4
        with:
          name: evaluator-output-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluator-output

      - name: source artifact 구조 확인
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/product-evaluation-request/product-snapshot.json"
          mapfile -t files < <(find "${RUNNER_TEMP}/evaluator-output" -type f -print)
          if [ "${#files[@]}" -ne 1 ] || [ "$(basename "${files[0]}")" != "evaluator.json" ]; then
            echo "evaluator output artifact must contain exactly evaluator.json" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/product-evaluation-final"

      - name: exact snapshot binding 검증 및 report 생성
        id: finalize
        working-directory: evaluation-control
        run: node_modules/.bin/tsx src/self-improvement/product-evaluation-handler.ts finalize
        env:
          PRODUCT_SNAPSHOT_JSON: ${{ runner.temp }}/product-evaluation-request/product-snapshot.json
          EVALUATOR_OUTPUT_JSON: ${{ runner.temp }}/evaluator-output/evaluator.json
          PRODUCT_EVALUATION_REPORT_JSON: ${{ runner.temp }}/product-evaluation-final/product-evaluation-report.json
          PRODUCT_EVALUATION_RUN_ID: ${{ github.run_id }}
          PRODUCT_EVALUATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          SNAPSHOT_SOURCE_RUN_ID: ${{ github.run_id }}
          SNAPSHOT_SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SNAPSHOT_ARTIFACT_NAME: ${{ needs.prepare.outputs.request_artifact_name }}
          SNAPSHOT_ARTIFACT_ID: ${{ needs.prepare.outputs.request_artifact_id }}
          SNAPSHOT_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.request_artifact_digest }}
          EVALUATOR_PROVIDER: claude-max-subscription
          EVALUATOR_ACTION: ${{ vars.AI_EXECUTOR_REPOSITORY }}/product-evaluation-poller.yml
          EVALUATOR_MODEL: opus
          # Private executor poller가 claude -p --effort medium으로 호출한다.
          EVALUATOR_REASONING_EFFORT: medium

      - name: 검증된 Product Evaluation report 저장
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.finalize.outputs.report_artifact_name }}
          path: ${{ runner.temp }}/product-evaluation-final/product-evaluation-report.json
          if-no-files-found: error

      - name: 기존 Issue 목록 수집
        uses: actions/github-script@v7
        env:
          EXISTING_ISSUES_JSON: ${{ runner.temp }}/product-evaluation-final/existing-issues.json
        with:
          script: |
            const fs = require('node:fs');
            const issues = [];
            // 중복 판단에 필요한 최근 Issue만 bounded하게 읽는다.
            for (let page = 1; page <= 5; page += 1) {
              const { data } = await github.rest.issues.listForRepo({
                ...context.repo,
                state: 'all',
                sort: 'created',
                direction: 'desc',
                per_page: 100,
                page,
              });
              for (const issue of data) {
                if (issue.pull_request) continue;
                issues.push({ number: issue.number, title: issue.title, state: issue.state });
              }
              if (data.length < 100) break;
            }
            fs.writeFileSync(process.env.EXISTING_ISSUES_JSON, JSON.stringify(issues, null, 2));
            core.info(`중복 판단 대상 Issue ${issues.length}건을 읽었습니다`);

      - name: 중복/후보 없음 여부를 결정적으로 판단
        id: decide
        working-directory: evaluation-control
        run: node_modules/.bin/tsx src/self-improvement/product-evaluation-handler.ts decide
        env:
          PRODUCT_SNAPSHOT_JSON: ${{ runner.temp }}/product-evaluation-request/product-snapshot.json
          PRODUCT_EVALUATION_REPORT_JSON: ${{ runner.temp }}/product-evaluation-final/product-evaluation-report.json
          EXISTING_ISSUES_JSON: ${{ runner.temp }}/product-evaluation-final/existing-issues.json
          IMPROVEMENT_ISSUE_DECISION_JSON: ${{ runner.temp }}/product-evaluation-final/issue-decision.json
          DISCOVERY_RESULT_COMMENT_MD: ${{ runner.temp }}/product-evaluation-final/discovery-result.md

      - name: proposal-only Improvement Candidate Issue 생성
        id: create
        if: steps.decide.outputs.action == 'create'
        uses: actions/github-script@v7
        env:
          IMPROVEMENT_ISSUE_DECISION_JSON: ${{ runner.temp }}/product-evaluation-final/issue-decision.json
        with:
          script: |
            const fs = require('node:fs');
            const decision = JSON.parse(fs.readFileSync(process.env.IMPROVEMENT_ISSUE_DECISION_JSON, 'utf8'));
            if (decision.action !== 'create') throw new Error('issue decision is not create');
            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title: decision.title,
              body: decision.body,
            });
            core.info(`Improvement Candidate Issue #${issue.number}를 생성했습니다`);
            core.setOutput('issue_number', String(issue.number));
            core.summary.addRaw(`Improvement Candidate Issue #${issue.number}: ${decision.title}`);
            await core.summary.write();

      # 사람이 Actions에서 PLAN을 수동으로 시작하던 한 단계를 없앤다. PLAN은 read-only 제안이며
      # 구현은 여전히 사람의 PLAN-승인 이후에만 시작된다. 후보 1개당 정확히 1회만 dispatch한다.
      - name: Read-only AI PLAN 자동 시작
        if: steps.decide.outputs.action == 'create' && steps.create.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          CANDIDATE_ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        with:
          script: |
            const issueNumber = process.env.CANDIDATE_ISSUE_NUMBER || '';
            if (!/^[1-9]\d*$/.test(issueNumber)) throw new Error('candidate issue number is required');
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'plan.yml',
              ref: context.payload.repository.default_branch,
              inputs: { issue_number: issueNumber },
            });
            core.info(`Improvement Candidate Issue #${issueNumber}에 대해 Read-only AI PLAN을 자동 dispatch했습니다`);

      - name: 생성하지 않은 이유 기록
        if: steps.decide.outputs.action == 'skip'
        shell: bash
        env:
          SKIP_REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          echo "Improvement Candidate Issue를 만들지 않았습니다: ${SKIP_REASON}"
          echo "Improvement Candidate Issue를 만들지 않았습니다: ${SKIP_REASON}" >> "$GITHUB_STEP_SUMMARY"

      # 비교한 후보 3개, 1위와 고르지 않은 이유, Issue 생성 결과를 Discovery 전용 Issue에 남긴다. AI를 다시 부르지 않는다.
      - name: Discovery 전용 Issue에 결과 기록
        uses: actions/github-script@v7
        env:
          DISCOVERY_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          DISCOVERY_RESULT_COMMENT_MD: ${{ runner.temp }}/product-evaluation-final/discovery-result.md
          CANDIDATE_ISSUE_NUMBER: ${{ steps.create.outputs.issue_number }}
        with:
          script: |
            const fs = require('node:fs');
            const issueNumber = process.env.DISCOVERY_ISSUE_NUMBER || '';
            const created = process.env.CANDIDATE_ISSUE_NUMBER || '';
            if (!/^[1-9]\d*$/.test(issueNumber)) throw new Error('Discovery Issue number is required');
            if (created && !/^[1-9]\d*$/.test(created)) throw new Error('candidate issue number is invalid');
            let body = fs.readFileSync(process.env.DISCOVERY_RESULT_COMMENT_MD, 'utf8').trimEnd();
            if (created) body += `\n\n생성한 Improvement Candidate Issue: #${created} (read-only AI PLAN을 자동으로 한 번 시작했습니다)`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(issueNumber), body });

      - name: Improvement Candidate 판단 결과 저장
        uses: actions/upload-artifact@v4
        with:
          name: product-improvement-decision-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-evaluation-final/issue-decision.json
          if-no-files-found: error

      # trusted 검증이나 결정 단계가 실패하면 사유가 Actions 로그에만 남아 Discovery Issue는 요청·결과 댓글만 남긴 채 침묵했다
      # (meeting-action-items run 38042323905: candidate scopePaths의 폴더 표기 `test/`가 거부됨, self-improvement-mvp #381).
      # 사람이 Issue만 보고도 멈춘 단계와 다음 행동을 알 수 있게 댓글 하나를 남긴다. 후보 Issue와 AI 호출은 만들지 않는다.
      - name: 검증 실패를 Discovery 전용 Issue에 알림
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCOVERY_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
          DECIDE_OUTCOME: ${{ steps.decide.outcome }}
          CREATE_OUTCOME: ${{ steps.create.outcome }}
        with:
          script: |
            const issueNumber = process.env.DISCOVERY_ISSUE_NUMBER || '';
            if (!/^[1-9]\d*$/.test(issueNumber)) throw new Error('Discovery Issue number is required');
            const failedStep = process.env.FINALIZE_OUTCOME === 'failure'
              ? 'Evaluator 결과의 trusted 검증'
              : process.env.DECIDE_OUTCOME === 'failure'
                ? '중복·후보 없음 판단'
                : process.env.CREATE_OUTCOME === 'failure'
                  ? 'Improvement Candidate Issue 생성'
                  : '결과 정리';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Product Discovery 중단',
              '',
              `${failedStep} 단계가 실패해 Improvement Candidate Issue를 만들지 못했습니다. 위 Evaluator 결과 댓글은 검증을 통과하지 못한 원문입니다.`,
              '',
              `실패 로그: ${runUrl}`,
              '',
              '같은 입력으로 AI를 다시 부르지 않았습니다. 다시 시도하려면 Actions에서 `Trusted Product Evaluation`을 다시 실행하세요(opus 호출 1회가 듭니다).',
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(issueNumber), body });
