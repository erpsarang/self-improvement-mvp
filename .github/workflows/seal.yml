name: Trusted SEAL

on:
  workflow_run:
    workflows: ["Untrusted IMPLEMENT"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  seal:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      SEAL_RUNTIME_DIR: ${{ runner.temp }}/seal

    steps:
      - name: IMPLEMENT candidate artifact 선택 또는 no-op 판정
        id: candidate_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/implement.yml') {
              core.setFailed(`unexpected source workflow path: ${run.path}`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const pattern = new RegExp(`^implement-candidate-(\\d+)-${run.id}-attempt-${run.run_attempt}$`);
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired && pattern.test(artifact.name));

            if (matches.length === 1) {
              core.setOutput('name', matches[0].name);
              core.setOutput('should_run', 'true');
              return;
            }

            if (matches.length === 0) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const implementJobs = jobsData.jobs.filter((job) => job.name === 'implement');
              const recordJobs = jobsData.jobs.filter((job) => job.name === 'clean IMPLEMENT provenance 기록');

              if (
                implementJobs.length === 1 &&
                implementJobs[0].conclusion === 'success' &&
                recordJobs.length === 1 &&
                recordJobs[0].conclusion === 'skipped'
              ) {
                core.info('source IMPLEMENT run was a valid no-op; SEAL is also a no-op');
                core.setOutput('should_run', 'false');
                return;
              }
            }

            core.setFailed(`expected exactly one candidate artifact or a valid no-op source run; matches=${matches.length}`);

      - name: source IMPLEMENT exact SHA checkout
        if: steps.candidate_artifact.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: IMPLEMENT candidate artifact 다운로드
        if: steps.candidate_artifact.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.candidate_artifact.outputs.name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: candidate artifact 구조 확인
        if: steps.candidate_artifact.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SEAL_RUNTIME_DIR"
          mapfile -t implement_files < <(find "${RUNNER_TEMP}/candidate" -type f -name implement.json -print)
          mapfile -t patch_files < <(find "${RUNNER_TEMP}/candidate" -type f -name candidate.patch -print)
          mapfile -t all_files < <(find "${RUNNER_TEMP}/candidate" -type f -print)
          if [ "${#implement_files[@]}" -ne 1 ] || [ "${#patch_files[@]}" -ne 1 ] || [ "${#all_files[@]}" -ne 2 ]; then
            echo "candidate artifact must contain exactly candidate.patch and implement.json" >&2
            exit 1
          fi
          cp "${implement_files[0]}" "$SEAL_RUNTIME_DIR/implement.json"
          cp "${patch_files[0]}" "$SEAL_RUNTIME_DIR/candidate.patch"

      - name: Node 설정
        if: steps.candidate_artifact.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: trusted base 의존성 설치
        if: steps.candidate_artifact.outputs.should_run == 'true'
        run: npm ci

      - name: candidate 무결성 검증 및 SEAL provenance 생성
        if: steps.candidate_artifact.outputs.should_run == 'true'
        run: npm exec -- tsx src/self-improvement/seal-handler.ts
        env:
          IMPLEMENT_JSON: ${{ runner.temp }}/seal/implement.json
          CANDIDATE_PATCH: ${{ runner.temp }}/seal/candidate.patch
          SEALED_PATCH: ${{ runner.temp }}/seal/sealed.patch
          SEAL_JSON: ${{ runner.temp }}/seal/seal.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate_artifact.outputs.name }}
          SEAL_RUN_ID: ${{ github.run_id }}
          SEAL_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: sealed artifact 저장
        if: steps.candidate_artifact.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sealed-candidate-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/seal/sealed.patch
            ${{ runner.temp }}/seal/seal.json
          if-no-files-found: error
