name: Embedded Orchestrator

on:
  workflow_call:

# Semantic REVIEW 이후 같은 Trusted Rail run 안에서 deterministic routing을 수행한다.
# 별도 workflow_run chain을 만들지 않으며, FIX 재진입만 새 workflow_dispatch root로 시작한다.
permissions: {}

jobs:
  route:
    name: trusted REVIEW decision routing
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.review_artifact.outputs.should_run }}
      review_artifact_name: ${{ steps.review_artifact.outputs.name }}
      review_artifact_attempt: ${{ steps.review_artifact.outputs.attempt }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      decision: ${{ steps.prepare.outputs.decision }}
      next_state: ${{ steps.prepare.outputs.next_state }}
      should_create_pr: ${{ steps.prepare.outputs.should_create_pr }}
      should_dispatch_fix: ${{ steps.prepare.outputs.should_dispatch_fix }}
      completed_fix_count: ${{ steps.prepare.outputs.completed_fix_count }}
      next_fix_attempt: ${{ steps.prepare.outputs.next_fix_attempt }}
      reviewed_branch: ${{ steps.prepare.outputs.reviewed_branch }}
      reviewed_head_sha: ${{ steps.prepare.outputs.reviewed_head_sha }}
      requirements_digest: ${{ steps.prepare.outputs.requirements_digest }}

    steps:
      - name: current 또는 이전 Trusted Rail REVIEW artifact 선택
        id: review_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(process.env.GITHUB_RUN_ID);
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runId) || runId <= 0 ||
                !Number.isSafeInteger(runAttempt) || runAttempt <= 0) {
              core.setFailed('invalid current Trusted Rail identity');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const pattern = new RegExp(
              `^review-provenance-issue-([1-9]\\d*)-${runId}-attempt-([1-9]\\d*)$`,
            );
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const match = pattern.exec(artifact.name);
                return match
                  ? { artifact, issueNumber: Number(match[1]), attempt: Number(match[2]) }
                  : null;
              })
              .filter(Boolean)
              .filter(({ attempt }) => attempt <= runAttempt);

            if (matches.length === 0) {
              core.setFailed('no current or prior REVIEW provenance artifact found');
              return;
            }

            const latestAttempt = Math.max(...matches.map(({ attempt }) => attempt));
            const latest = matches.filter(({ attempt }) => attempt === latestAttempt);
            if (latest.length !== 1) {
              core.setFailed(`ambiguous REVIEW provenance artifacts for attempt ${latestAttempt}: ${latest.length}`);
              return;
            }

            if (latestAttempt < runAttempt) {
              core.info(`Orchestrator attempt ${runAttempt} reuses REVIEW artifact from attempt ${latestAttempt}`);
            }
            core.setOutput('name', latest[0].artifact.name);
            core.setOutput('attempt', String(latestAttempt));
            core.setOutput('should_run', 'true');

      - name: trusted Orchestrator control-plane checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: REVIEW provenance artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.review_artifact.outputs.name }}
          path: ${{ runner.temp }}/orchestrator-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: REVIEW artifact 구조 확인
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/orchestrator"
          mapfile -t review_files < <(find "${RUNNER_TEMP}/orchestrator-source" -type f -name review.json -print)
          mapfile -t all_files < <(find "${RUNNER_TEMP}/orchestrator-source" -type f -print)
          if [ "${#review_files[@]}" -ne 1 ] || [ "${#all_files[@]}" -ne 1 ]; then
            echo "REVIEW provenance artifact must contain exactly review.json" >&2
            exit 1
          fi
          cp "${review_files[0]}" "${RUNNER_TEMP}/orchestrator/review.json"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: trusted Orchestrator 의존성 설치
        run: npm ci

      - name: REVIEW provenance 재검증 및 next state 결정
        id: prepare
        run: npm exec -- tsx src/self-improvement/orchestrator-handler.ts prepare
        env:
          REVIEW_JSON: ${{ runner.temp }}/orchestrator/review.json
          REVIEW_ARTIFACT_NAME: ${{ steps.review_artifact.outputs.name }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          SOURCE_REVIEW_RUN_ID: ${{ github.run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ steps.review_artifact.outputs.attempt }}
          SOURCE_REVIEW_CONCLUSION: success
          SOURCE_REVIEW_WORKFLOW_PATH: .github/workflows/trusted-rail.yml

  merge_boundary:
    name: exact-SHA Human Merge PR boundary
    needs: route
    if: >-
      needs.route.result == 'success' &&
      needs.route.outputs.should_run == 'true' &&
      needs.route.outputs.should_create_pr == 'true'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
      pr_base_branch: ${{ steps.pr.outputs.pr_base_branch }}
      pr_head_branch: ${{ steps.pr.outputs.pr_head_branch }}
      pr_head_sha: ${{ steps.pr.outputs.pr_head_sha }}

    steps:
      - name: exact reviewed SHA 확인 후 Human Merge PR 생성 또는 재사용
        id: pr
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.route.outputs.issue_number }}
          REVIEWED_BRANCH: ${{ needs.route.outputs.reviewed_branch }}
          REVIEWED_HEAD_SHA: ${{ needs.route.outputs.reviewed_head_sha }}
          REVIEW_DECISION: ${{ needs.route.outputs.decision }}
          NEXT_STATE: ${{ needs.route.outputs.next_state }}
          REQUIREMENTS_DIGEST: ${{ needs.route.outputs.requirements_digest }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branch = process.env.REVIEWED_BRANCH;
            const expectedSha = process.env.REVIEWED_HEAD_SHA;
            const decision = process.env.REVIEW_DECISION;
            const nextState = process.env.NEXT_STATE;
            const requirementsDigest = process.env.REQUIREMENTS_DIGEST;
            const base = context.payload.repository.default_branch;

            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('invalid issue number');
              return;
            }
            if (decision !== 'PASS' || nextState !== 'MERGE_READY') {
              core.setFailed(`PR boundary requires PASS → MERGE_READY; decision=${decision}, next=${nextState}`);
              return;
            }
            if (branch !== `ai-publish/issue-${issueNumber}`) {
              core.setFailed(`unexpected reviewed branch: ${branch}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('invalid reviewed SHA');
              return;
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(requirementsDigest)) {
              core.setFailed('invalid requirements digest');
              return;
            }

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            if (ref.object.type !== 'commit' || ref.object.sha !== expectedSha) {
              core.setFailed(`reviewed branch HEAD mismatch: expected=${expectedSha}, actual=${ref.object.sha}`);
              return;
            }

            const { data: candidates } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${context.repo.owner}:${branch}`,
              base,
              per_page: 100,
            });
            const exactBranchPrs = candidates.filter(
              (pr) => pr.head.ref === branch && pr.base.ref === base,
            );
            if (exactBranchPrs.length > 1) {
              core.setFailed(`ambiguous Human Merge PRs: ${exactBranchPrs.length}`);
              return;
            }

            let pr;
            if (exactBranchPrs.length === 1) {
              pr = exactBranchPrs[0];
              if (pr.state !== 'open') {
                core.setFailed(`existing Human Merge PR is not open: #${pr.number} state=${pr.state}`);
                return;
              }
              core.info(`reusing existing Human Merge PR #${pr.number}`);
            } else {
              const marker = `<!-- ai-dev-framework:MERGE_READY issue=${issueNumber} reviewed-sha=${expectedSha} -->`;
              const { data: created } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Issue #${issueNumber}: 검증·리뷰 완료 candidate (Human Merge)`,
                head: branch,
                base,
                body: [
                  '## AI Development Framework — MERGE_READY',
                  '',
                  'Trusted Semantic REVIEW가 `PASS`한 exact candidate입니다.',
                  '',
                  `- Issue: #${issueNumber}`,
                  `- reviewed exact SHA: \`${expectedSha}\``,
                  `- requirements digest: \`${requirementsDigest}\``,
                  '- 최종 Merge는 **Human-only**입니다.',
                  '- Auto Merge는 사용하지 않습니다.',
                  '',
                  `Closes #${issueNumber}`,
                  '',
                  marker,
                ].join('\n'),
              });
              pr = created;
              core.info(`created Human Merge PR #${pr.number}`);
            }

            const { data: exactPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            if (
              exactPr.state !== 'open' ||
              exactPr.base.ref !== base ||
              exactPr.head.ref !== branch ||
              exactPr.head.sha !== expectedSha
            ) {
              core.setFailed(
                `Human Merge PR exact identity mismatch: state=${exactPr.state}, base=${exactPr.base.ref}, head=${exactPr.head.ref}, sha=${exactPr.head.sha}`,
              );
              return;
            }

            core.setOutput('pr_number', String(exactPr.number));
            core.setOutput('pr_url', exactPr.html_url);
            core.setOutput('pr_base_branch', exactPr.base.ref);
            core.setOutput('pr_head_branch', exactPr.head.ref);
            core.setOutput('pr_head_sha', exactPr.head.sha);

  record:
    name: trusted Orchestration provenance 기록
    needs: [route, merge_boundary]
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.route.outputs.should_run == 'true' &&
      (needs.route.outputs.should_create_pr != 'true' || needs.merge_boundary.result == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: trusted Orchestrator control-plane checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: source REVIEW artifact exact 재선택
        id: review_artifact
        uses: actions/github-script@v7
        env:
          PREPARED_REVIEW_ARTIFACT: ${{ needs.route.outputs.review_artifact_name }}
          PREPARED_REVIEW_ATTEMPT: ${{ needs.route.outputs.review_artifact_attempt }}
        with:
          script: |
            const runId = Number(process.env.GITHUB_RUN_ID);
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const prepared = process.env.PREPARED_REVIEW_ARTIFACT;
            const preparedAttempt = Number(process.env.PREPARED_REVIEW_ATTEMPT);
            if (!Number.isSafeInteger(runId) || runId <= 0 ||
                !Number.isSafeInteger(runAttempt) || runAttempt <= 0 ||
                !Number.isSafeInteger(preparedAttempt) || preparedAttempt <= 0) {
              core.setFailed('invalid current or prepared Trusted Rail identity');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const pattern = new RegExp(
              `^review-provenance-issue-([1-9]\\d*)-${runId}-attempt-([1-9]\\d*)$`,
            );
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const match = pattern.exec(artifact.name);
                return match
                  ? { artifact, issueNumber: Number(match[1]), attempt: Number(match[2]) }
                  : null;
              })
              .filter(Boolean)
              .filter(({ attempt }) => attempt <= runAttempt);
            if (matches.length === 0) {
              core.setFailed('no current or prior REVIEW provenance artifact found during record');
              return;
            }
            const latestAttempt = Math.max(...matches.map(({ attempt }) => attempt));
            const latest = matches.filter(({ attempt }) => attempt === latestAttempt);
            if (
              latest.length !== 1 ||
              latest[0].artifact.name !== prepared ||
              latestAttempt !== preparedAttempt
            ) {
              core.setFailed(
                `REVIEW artifact changed between route and record; latestAttempt=${latestAttempt}, matches=${latest.length}`,
              );
              return;
            }
            core.setOutput('name', latest[0].artifact.name);
            core.setOutput('attempt', String(latestAttempt));

      - name: REVIEW provenance artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.review_artifact.outputs.name }}
          path: ${{ runner.temp }}/orchestrator-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: REVIEW artifact 구조 확인
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/orchestrator"
          mapfile -t review_files < <(find "${RUNNER_TEMP}/orchestrator-source" -type f -name review.json -print)
          mapfile -t all_files < <(find "${RUNNER_TEMP}/orchestrator-source" -type f -print)
          if [ "${#review_files[@]}" -ne 1 ] || [ "${#all_files[@]}" -ne 1 ]; then
            echo "REVIEW provenance artifact must contain exactly review.json" >&2
            exit 1
          fi
          cp "${review_files[0]}" "${RUNNER_TEMP}/orchestrator/review.json"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: trusted Orchestrator 의존성 설치
        run: npm ci

      - name: REVIEW provenance fresh runner 재검증
        id: revalidate
        run: npm exec -- tsx src/self-improvement/orchestrator-handler.ts prepare
        env:
          REVIEW_JSON: ${{ runner.temp }}/orchestrator/review.json
          REVIEW_ARTIFACT_NAME: ${{ steps.review_artifact.outputs.name }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          SOURCE_REVIEW_RUN_ID: ${{ github.run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ steps.review_artifact.outputs.attempt }}
          SOURCE_REVIEW_CONCLUSION: success
          SOURCE_REVIEW_WORKFLOW_PATH: .github/workflows/trusted-rail.yml

      - name: route와 record exact identity 비교
        shell: bash
        env:
          EXPECTED_ISSUE: ${{ needs.route.outputs.issue_number }}
          EXPECTED_DECISION: ${{ needs.route.outputs.decision }}
          EXPECTED_STATE: ${{ needs.route.outputs.next_state }}
          EXPECTED_COMPLETED_FIX_COUNT: ${{ needs.route.outputs.completed_fix_count }}
          EXPECTED_NEXT_FIX_ATTEMPT: ${{ needs.route.outputs.next_fix_attempt }}
          EXPECTED_BRANCH: ${{ needs.route.outputs.reviewed_branch }}
          EXPECTED_SHA: ${{ needs.route.outputs.reviewed_head_sha }}
          EXPECTED_REQUIREMENTS: ${{ needs.route.outputs.requirements_digest }}
          ACTUAL_ISSUE: ${{ steps.revalidate.outputs.issue_number }}
          ACTUAL_DECISION: ${{ steps.revalidate.outputs.decision }}
          ACTUAL_STATE: ${{ steps.revalidate.outputs.next_state }}
          ACTUAL_COMPLETED_FIX_COUNT: ${{ steps.revalidate.outputs.completed_fix_count }}
          ACTUAL_NEXT_FIX_ATTEMPT: ${{ steps.revalidate.outputs.next_fix_attempt }}
          ACTUAL_BRANCH: ${{ steps.revalidate.outputs.reviewed_branch }}
          ACTUAL_SHA: ${{ steps.revalidate.outputs.reviewed_head_sha }}
          ACTUAL_REQUIREMENTS: ${{ steps.revalidate.outputs.requirements_digest }}
        run: |
          set -euo pipefail
          if [ "$EXPECTED_ISSUE" != "$ACTUAL_ISSUE" ] || \
             [ "$EXPECTED_DECISION" != "$ACTUAL_DECISION" ] || \
             [ "$EXPECTED_STATE" != "$ACTUAL_STATE" ] || \
             [ "$EXPECTED_COMPLETED_FIX_COUNT" != "$ACTUAL_COMPLETED_FIX_COUNT" ] || \
             [ "$EXPECTED_NEXT_FIX_ATTEMPT" != "$ACTUAL_NEXT_FIX_ATTEMPT" ] || \
             [ "$EXPECTED_BRANCH" != "$ACTUAL_BRANCH" ] || \
             [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ] || \
             [ "$EXPECTED_REQUIREMENTS" != "$ACTUAL_REQUIREMENTS" ]; then
            echo "Orchestrator identity changed between route and record" >&2
            exit 1
          fi

      - name: Orchestration provenance 생성
        run: npm exec -- tsx src/self-improvement/orchestrator-handler.ts finalize
        env:
          REVIEW_JSON: ${{ runner.temp }}/orchestrator/review.json
          REVIEW_ARTIFACT_NAME: ${{ steps.review_artifact.outputs.name }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          SOURCE_REVIEW_RUN_ID: ${{ github.run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ steps.review_artifact.outputs.attempt }}
          SOURCE_REVIEW_CONCLUSION: success
          SOURCE_REVIEW_WORKFLOW_PATH: .github/workflows/trusted-rail.yml
          ORCHESTRATOR_RUN_ID: ${{ github.run_id }}
          ORCHESTRATOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          ORCHESTRATOR_TRUSTED_CODE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_PR_NUMBER: ${{ needs.merge_boundary.outputs.pr_number }}
          MERGE_PR_URL: ${{ needs.merge_boundary.outputs.pr_url }}
          MERGE_PR_BASE_BRANCH: ${{ needs.merge_boundary.outputs.pr_base_branch }}
          MERGE_PR_HEAD_BRANCH: ${{ needs.merge_boundary.outputs.pr_head_branch }}
          MERGE_PR_HEAD_SHA: ${{ needs.merge_boundary.outputs.pr_head_sha }}
          ORCHESTRATION_JSON: ${{ runner.temp }}/orchestrator/orchestration.json

      - name: Orchestration provenance artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-provenance-issue-${{ steps.revalidate.outputs.issue_number }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orchestrator/orchestration.json
          if-no-files-found: error

  fix_dispatch:
    name: bounded FIX request dispatch
    needs: [route, record]
    if: >-
      always() &&
      needs.route.result == 'success' &&
      needs.record.result == 'success' &&
      needs.route.outputs.should_dispatch_fix == 'true'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest

    steps:
      - name: LOCAL_FIX exact identity 확인 후 새 root FIX request 시작
        uses: actions/github-script@v7
        env:
          REVIEW_DECISION: ${{ needs.route.outputs.decision }}
          NEXT_STATE: ${{ needs.route.outputs.next_state }}
          SOURCE_REVIEW_RUN_ID: ${{ github.run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ needs.route.outputs.review_artifact_attempt }}
          SOURCE_REVIEW_ARTIFACT_NAME: ${{ needs.route.outputs.review_artifact_name }}
          FIX_ATTEMPT: ${{ needs.route.outputs.next_fix_attempt }}
          REVIEWED_BRANCH: ${{ needs.route.outputs.reviewed_branch }}
          REVIEWED_HEAD_SHA: ${{ needs.route.outputs.reviewed_head_sha }}
        with:
          script: |
            const decision = process.env.REVIEW_DECISION;
            const nextState = process.env.NEXT_STATE;
            const sourceRunId = Number(process.env.SOURCE_REVIEW_RUN_ID);
            const sourceAttempt = Number(process.env.SOURCE_REVIEW_RUN_ATTEMPT);
            const artifactName = process.env.SOURCE_REVIEW_ARTIFACT_NAME;
            const fixAttempt = Number(process.env.FIX_ATTEMPT);
            const branch = process.env.REVIEWED_BRANCH;
            const reviewedSha = process.env.REVIEWED_HEAD_SHA;
            const base = context.payload.repository.default_branch;

            if (decision !== 'LOCAL_FIX' || nextState !== 'FIXING') {
              core.setFailed(`FIX dispatch requires LOCAL_FIX → FIXING; decision=${decision}, next=${nextState}`);
              return;
            }
            if (!Number.isSafeInteger(sourceRunId) || sourceRunId <= 0 ||
                !Number.isSafeInteger(sourceAttempt) || sourceAttempt <= 0 ||
                !(fixAttempt === 1 || fixAttempt === 2)) {
              core.setFailed('invalid FIX dispatch identity');
              return;
            }
            const expectedArtifact =
              `review-provenance-issue-${process.env.GITHUB_EVENT_PATH ? process.env.ISSUE_NUMBER ?? '' : ''}`;
            const artifactPattern = new RegExp(
              `^review-provenance-issue-[1-9]\\d*-${sourceRunId}-attempt-${sourceAttempt}$`,
            );
            if (!artifactPattern.test(artifactName)) {
              core.setFailed(`invalid source REVIEW artifact: ${artifactName}`);
              return;
            }
            if (branch !== artifactName.replace(/^review-provenance-issue-(\d+)-.*$/, 'ai-publish/issue-$1')) {
              core.setFailed(`source REVIEW issue/branch mismatch: artifact=${artifactName}, branch=${branch}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(reviewedSha)) {
              core.setFailed('invalid reviewed SHA');
              return;
            }

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            if (ref.object.type !== 'commit' || ref.object.sha !== reviewedSha) {
              core.setFailed(`FIX dispatch reviewed HEAD mismatch: expected=${reviewedSha}, actual=${ref.object.sha}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fix-request.yml',
              ref: base,
              inputs: {
                source_review_run_id: String(sourceRunId),
                source_review_run_attempt: String(sourceAttempt),
                source_review_artifact_name: artifactName,
                fix_attempt: String(fixAttempt),
              },
            });
            core.info(`dispatched Trusted FIX Request for ${artifactName}, FIX #${fixAttempt}`);
