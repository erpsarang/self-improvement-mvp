name: Trusted PLAN Recovery

on:
  workflow_run:
    workflows: ["Trusted PLAN_AUTHORIZE"]
    types: [completed]

permissions: {}

concurrency:
  group: plan-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'issue_comment'
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: PLAN_AUTHORIZE artifact exact 선택
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/plan-authorize.yml') {
              core.setFailed(`unexpected source workflow path: ${run.path}`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const pattern = new RegExp(
              `^plan-authorize-issue-\\d+-plan-\\d+-attempt-\\d+-approval-\\d+-run-${run.id}-attempt-([1-9]\\d*)$`,
            );
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const match = pattern.exec(artifact.name);
                return match ? { artifact, attempt: Number(match[1]) } : null;
              })
              .filter(Boolean);
            const current = matches.filter(({ attempt }) => attempt === run.run_attempt);
            const prior = matches.filter(({ attempt }) => attempt < run.run_attempt);

            let selected = null;
            if (current.length === 1 && matches.length === 1) {
              selected = current[0];
            } else if (current.length === 0 && prior.length === 1 && matches.length === 1) {
              selected = prior[0];
              core.info(`PLAN_AUTHORIZE rerun ${run.run_attempt} reuses trusted artifact from attempt ${selected.attempt}`);
            } else if (matches.length === 0) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const jobs = jobsData.jobs.filter((job) => job.name === 'authorize');
              if (jobs.length === 1 && jobs[0].conclusion === 'skipped') {
                core.setOutput('should_run', 'false');
                return;
              }
            }

            if (!selected) {
              core.setFailed(
                `expected one exact PLAN_AUTHORIZE artifact or one trusted replay artifact; current=${current.length}, prior=${prior.length}, total=${matches.length}`,
              );
              return;
            }

            core.setOutput('should_run', 'true');
            core.setOutput('name', selected.artifact.name);
            core.setOutput('id', String(selected.artifact.id));
            core.setOutput('digest', selected.artifact.digest ?? '');

      - name: Trusted recovery control-plane checkout
        if: steps.source.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Node 설정
        if: steps.source.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .framework-runtime/package-lock.json

      - name: Trusted dependencies 설치
        if: steps.source.outputs.should_run == 'true'
        run: |
          npm ci --ignore-scripts --prefix .framework-runtime
          ln -sT .framework-runtime/node_modules node_modules

      - name: PLAN_AUTHORIZE artifact 다운로드
        if: steps.source.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.name }}
          path: ${{ runner.temp }}/plan-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: PLAN_AUTHORIZE artifact 구조 확인
        if: steps.source.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find "${RUNNER_TEMP}/plan-recovery" -type f -name plan-authorize.json -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "plan-authorize.json must exist exactly once" >&2
            exit 1
          fi
          cp "${files[0]}" "${RUNNER_TEMP}/plan-authorize.json"

      - name: stale PLAN 분류 및 fresh PLAN 자동 복구
        if: steps.source.outputs.should_run == 'true'
        id: recover
        run: .framework-runtime/node_modules/.bin/tsx src/self-improvement/plan-recovery-handler.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.name }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.digest }}
          PLAN_AUTHORIZE_JSON: ${{ runner.temp }}/plan-authorize.json
