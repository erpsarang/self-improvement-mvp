name: Subscription exchange

# PLAN Bounded IMPLEMENT Worker(최초 IMPLEMENT, repair 1/2), Semantic REVIEW, bounded FIX Worker, LEARN, Product Evaluation이 같은 exact request/result 교환을 쓴다.
# reusable workflow job도 호출한 run 안에서 돌기 때문에 Private Executor가 보는 run id/name/path는 호출한 Worker나 Trusted Rail 그대로다.
on:
  workflow_call:
    inputs:
      kind:
        description: "IMPLEMENT, REVIEW, FIX, LEARN 또는 PRODUCT_EVALUATION"
        type: string
        required: true
      label:
        description: 요청 댓글 제목에 쓸 짧은 이름
        type: string
        required: true
      issue_number:
        type: string
        required: true
      request_artifact_name:
        type: string
        required: true
      request_artifact_id:
        type: string
        required: true
      request_artifact_digest:
        type: string
        required: true
      result_artifact_name:
        type: string
        required: true
      result_file_name:
        type: string
        required: true
    secrets:
      EXECUTOR_DISPATCH_TOKEN:
        required: false

permissions: {}

jobs:
  request:
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      request_id: ${{ steps.marker.outputs.request_id }}
      request_comment_id: ${{ steps.marker.outputs.request_comment_id }}
      poller: ${{ steps.marker.outputs.poller }}

    steps:
      - name: subscription request 고정 및 marker 기록
        id: marker
        uses: actions/github-script@v7
        env:
          SUBSCRIPTION_KIND: ${{ inputs.kind }}
          SUBSCRIPTION_LABEL: ${{ inputs.label }}
          SUBSCRIPTION_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUEST_ARTIFACT_NAME: ${{ inputs.request_artifact_name }}
          REQUEST_ARTIFACT_ID: ${{ inputs.request_artifact_id }}
          REQUEST_ARTIFACT_DIGEST: ${{ inputs.request_artifact_digest }}
        with:
          script: |
            // BEGIN subscription-exchange
            // Private subscription-ai-executor IMPLEMENT/REVIEW/FIX/LEARN/PRODUCT_EVALUATION 계약과 byte 단위로 맞춘다. request job과 wait job이 같은 사본을 쓴다.
            const SUBSCRIPTION_REQUEST_FILES = ['identity.json', 'prompt.md', 'schema.json'];
            // kind별로 identity 종류, 고정 model, 결과를 기다리는 Public run, Private poller가 다르다.
            const SUBSCRIPTION_KINDS = {
              IMPLEMENT: { identityKind: 'trusted-implement-request', model: 'sonnet', run: 'worker', poller: 'implement-poller.yml' },
              REVIEW: { identityKind: 'trusted-review-request', model: 'opus', run: 'rail', poller: 'review-poller.yml' },
              FIX: { identityKind: 'trusted-fix-request', model: 'sonnet', run: 'worker', poller: 'fix-poller.yml' },
              LEARN: { identityKind: 'trusted-learn-request', model: 'sonnet', run: 'worker', poller: 'learn-poller.yml' },
              PRODUCT_EVALUATION: { identityKind: 'trusted-product-evaluation-request', model: 'sonnet', run: 'worker', poller: 'product-evaluation-poller.yml' },
            };

            function subscriptionKind(kind) {
              const spec = SUBSCRIPTION_KINDS[kind];
              if (!spec) throw new Error(`unsupported subscription kind: ${kind}`);
              return spec;
            }

            // Python json.dumps(sort_keys=True, separators=(",", ":"))와 같은 canonical JSON.
            function canonicalJson(value) {
              if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`;
              if (value !== null && typeof value === 'object') {
                return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
              }
              return JSON.stringify(value);
            }

            function subscriptionRequestId(identity, artifactId, artifactDigest) {
              return require('crypto')
                .createHash('sha256')
                .update(canonicalJson([identity, artifactId, artifactDigest]), 'utf8')
                .digest('hex');
            }

            function subscriptionMarkerFields(kind, identity, requestId, artifactId, artifactDigest) {
              subscriptionKind(kind);
              if (!/^[0-9a-f]{64}$/.test(requestId)) throw new Error('subscription request ID is invalid');
              if (!Number.isSafeInteger(artifactId) || artifactId < 1) throw new Error('request artifact id is invalid');
              if (!/^[0-9a-f]{64}$/.test(artifactDigest)) throw new Error('request artifact digest is invalid');
              const run = kind === 'REVIEW'
                ? [`head=${identity.headSha}`, `run=${identity.rail.runId}`, `run-attempt=${identity.rail.runAttempt}`]
                : [`worker-run=${identity.worker.runId}`, `worker-attempt=${identity.worker.runAttempt}`];
              return [
                `request=${requestId}`,
                `issue=${identity.issueNumber}`,
                `repository=${identity.repository}`,
                `base=${identity.baseSha}`,
                ...run,
                `artifact=${artifactId}`,
                `digest=${artifactDigest}`,
                `model=${identity.model}`,
              ].join(' ');
            }

            function subscriptionRequestMarker(kind, identity, requestId, artifactId, artifactDigest) {
              return `<!-- ai-dev-framework:${kind}_REQUEST v=1 ${subscriptionMarkerFields(kind, identity, requestId, artifactId, artifactDigest)} -->`;
            }

            function subscriptionResultMarker(kind, identity, requestId, artifactId, artifactDigest) {
              return `<!-- ai-dev-framework:${kind}_RESULT v=1 ${subscriptionMarkerFields(kind, identity, requestId, artifactId, artifactDigest)} encoding=gzip-base64 -->`;
            }

            // owner가 남긴 exact RESULT 1개만 받는다. 없으면 null, 중복·불일치·손상이면 throw.
            function selectSubscriptionResult(kind, comments, { requestId, requestCommentId, owner, expectedMarker }) {
              subscriptionKind(kind);
              const prefix = `<!-- ai-dev-framework:${kind}_RESULT v=1 request=${requestId} `;
              const results = comments
                .filter((comment) => Number(comment.id) > requestCommentId)
                .filter((comment) =>
                  comment.author_association === 'OWNER' &&
                  comment.user?.type === 'User' &&
                  comment.user?.login === owner
                )
                .filter((comment) => typeof comment.body === 'string' && comment.body.includes(prefix));
              if (results.length === 0) return null;
              if (results.length > 1) throw new Error(`Duplicate ${kind}_RESULT comments`);
              const [marker, ...rest] = results[0].body.split(/\r?\n/);
              if (marker !== expectedMarker) throw new Error(`${kind}_RESULT identity mismatch`);
              const payload = new RegExp(`^${kind}_RESULT_GZIP_BASE64:\\s*([A-Za-z0-9+/=]+)\\s*$`).exec(rest.join('\n'))?.[1];
              if (!payload) throw new Error(`Missing ${kind}_RESULT payload`);
              const raw = require('zlib').gunzipSync(Buffer.from(payload, 'base64')).toString('utf8');
              const value = JSON.parse(raw);
              if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${kind}_RESULT payload must be a JSON object`);
              return { commentId: Number(results[0].id), raw };
            }

            // 같은 run의 trusted job이 올린 request artifact를 id로 다시 받아 zip digest, 파일 집합, identity binding을 확인한다.
            async function loadSubscriptionRequest({ kind, github, context, artifactName, artifactId, artifactDigest, issueNumber, directory }) {
              const spec = subscriptionKind(kind);
              const fs = require('fs');
              const path = require('path');
              if (!Number.isSafeInteger(artifactId) || artifactId < 1 || !/^[0-9a-f]{64}$/.test(artifactDigest)) {
                throw new Error('subscription request artifact identity is invalid');
              }
              const { data: metadata } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: artifactId });
              if (
                metadata.name !== artifactName ||
                metadata.expired ||
                Number(metadata.workflow_run?.id) !== context.runId ||
                (metadata.digest != null && metadata.digest !== `sha256:${artifactDigest}`)
              ) {
                throw new Error('subscription request artifact metadata mismatch');
              }
              const download = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifactId, archive_format: 'zip' });
              const archive = Buffer.from(download.data);
              if (require('crypto').createHash('sha256').update(archive).digest('hex') !== artifactDigest) {
                throw new Error('subscription request artifact digest mismatch');
              }
              fs.rmSync(directory, { recursive: true, force: true });
              fs.mkdirSync(directory, { recursive: true });
              const archivePath = `${directory}.zip`;
              fs.writeFileSync(archivePath, archive);
              require('child_process').execFileSync('unzip', ['-q', archivePath, '-d', directory]);
              const entries = fs.readdirSync(directory, { withFileTypes: true });
              if (entries.some((entry) => !entry.isFile()) || entries.map((entry) => entry.name).sort().join(',') !== SUBSCRIPTION_REQUEST_FILES.join(',')) {
                throw new Error('subscription request artifact file set mismatch');
              }
              // identity 전체 schema는 request를 만든 trusted job이 고정했다. 여기서는 이 run, Issue, kind에 묶였는지만 다시 본다.
              const identity = JSON.parse(fs.readFileSync(path.join(directory, 'identity.json'), 'utf8'));
              const run = identity[spec.run];
              if (
                identity.kind !== spec.identityKind ||
                identity.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                identity.issueNumber !== issueNumber ||
                run?.runId !== context.runId ||
                run?.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
                identity.model !== spec.model
              ) {
                throw new Error('subscription request identity mismatch');
              }
              return identity;
            }
            // END subscription-exchange
            const kind = process.env.SUBSCRIPTION_KIND;
            const spec = subscriptionKind(kind);
            const issueNumber = Number(process.env.SUBSCRIPTION_ISSUE_NUMBER);
            const artifactId = Number(process.env.REQUEST_ARTIFACT_ID);
            const artifactDigest = process.env.REQUEST_ARTIFACT_DIGEST || '';
            const identity = await loadSubscriptionRequest({
              kind,
              github,
              context,
              artifactName: process.env.REQUEST_ARTIFACT_NAME,
              artifactId,
              artifactDigest,
              issueNumber,
              directory: `${process.env.RUNNER_TEMP}/subscription-request`,
            });
            const requestId = subscriptionRequestId(identity, artifactId, artifactDigest);
            const marker = subscriptionRequestMarker(kind, identity, requestId, artifactId, artifactDigest);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').startsWith(marker)
            );
            const comment = existing ?? (await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: [
                marker,
                `## ${kind} 실행 요청 대기 (${process.env.SUBSCRIPTION_LABEL})`,
                `Request: \`${requestId}\``,
                'Private subscription executor가 이 bounded prompt/schema만 사용해 결과를 1회 생성합니다. 결과는 Public trusted 검증을 다시 거칩니다.',
              ].join('\n\n'),
            })).data;
            core.setOutput('request_id', requestId);
            core.setOutput('request_comment_id', String(comment.id));
            core.setOutput('poller', spec.poller);

      - name: Private subscription executor 깨우기
        env:
          EXECUTOR_DISPATCH_TOKEN: ${{ secrets.EXECUTOR_DISPATCH_TOKEN }}
          SUBSCRIPTION_REQUEST_ID: ${{ steps.marker.outputs.request_id }}
          SUBSCRIPTION_POLLER: ${{ steps.marker.outputs.poller }}
          SUBSCRIPTION_REPOSITORY: ${{ github.repository }}
          # 이 repository의 AI 호출을 처리할 executor. 팀마다 자기 구독 runner로 도는 executor repo를 변수로 정한다.
          AI_EXECUTOR_REPOSITORY: ${{ vars.AI_EXECUTOR_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXECUTOR_DISPATCH_TOKEN:-}" ]; then
            echo "Missing EXECUTOR_DISPATCH_TOKEN (fine-grained token: AI_EXECUTOR_REPOSITORY / Actions: write)." >&2
            exit 1
          fi
          if [[ ! "${AI_EXECUTOR_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Missing or invalid AI_EXECUTOR_REPOSITORY variable (owner/repo of this repository's subscription executor)." >&2
            exit 1
          fi
          if [[ ! "$SUBSCRIPTION_REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid SUBSCRIPTION_REQUEST_ID; refusing executor dispatch." >&2
            exit 1
          fi
          if [[ ! "$SUBSCRIPTION_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid SUBSCRIPTION_REPOSITORY; refusing executor dispatch." >&2
            exit 1
          fi
          case "$SUBSCRIPTION_POLLER" in
            implement-poller.yml|review-poller.yml|fix-poller.yml|learn-poller.yml|product-evaluation-poller.yml) ;;
            *) echo "Unsupported subscription poller: $SUBSCRIPTION_POLLER" >&2; exit 1 ;;
          esac
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EXECUTOR_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${AI_EXECUTOR_REPOSITORY}/actions/workflows/${SUBSCRIPTION_POLLER}/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"request_id\":\"$SUBSCRIPTION_REQUEST_ID\",\"repository\":\"$SUBSCRIPTION_REPOSITORY\"}}"

  wait:
    needs: request
    permissions:
      actions: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: subscription result 대기 및 exact 검증
        timeout-minutes: 17
        uses: actions/github-script@v7
        env:
          SUBSCRIPTION_KIND: ${{ inputs.kind }}
          SUBSCRIPTION_REQUEST_ID: ${{ needs.request.outputs.request_id }}
          SUBSCRIPTION_REQUEST_COMMENT_ID: ${{ needs.request.outputs.request_comment_id }}
          SUBSCRIPTION_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUEST_ARTIFACT_NAME: ${{ inputs.request_artifact_name }}
          REQUEST_ARTIFACT_ID: ${{ inputs.request_artifact_id }}
          REQUEST_ARTIFACT_DIGEST: ${{ inputs.request_artifact_digest }}
          RESULT_FILE_NAME: ${{ inputs.result_file_name }}
        with:
          script: |
            // BEGIN subscription-exchange
            // Private subscription-ai-executor IMPLEMENT/REVIEW/FIX/LEARN/PRODUCT_EVALUATION 계약과 byte 단위로 맞춘다. request job과 wait job이 같은 사본을 쓴다.
            const SUBSCRIPTION_REQUEST_FILES = ['identity.json', 'prompt.md', 'schema.json'];
            // kind별로 identity 종류, 고정 model, 결과를 기다리는 Public run, Private poller가 다르다.
            const SUBSCRIPTION_KINDS = {
              IMPLEMENT: { identityKind: 'trusted-implement-request', model: 'sonnet', run: 'worker', poller: 'implement-poller.yml' },
              REVIEW: { identityKind: 'trusted-review-request', model: 'opus', run: 'rail', poller: 'review-poller.yml' },
              FIX: { identityKind: 'trusted-fix-request', model: 'sonnet', run: 'worker', poller: 'fix-poller.yml' },
              LEARN: { identityKind: 'trusted-learn-request', model: 'sonnet', run: 'worker', poller: 'learn-poller.yml' },
              PRODUCT_EVALUATION: { identityKind: 'trusted-product-evaluation-request', model: 'sonnet', run: 'worker', poller: 'product-evaluation-poller.yml' },
            };

            function subscriptionKind(kind) {
              const spec = SUBSCRIPTION_KINDS[kind];
              if (!spec) throw new Error(`unsupported subscription kind: ${kind}`);
              return spec;
            }

            // Python json.dumps(sort_keys=True, separators=(",", ":"))와 같은 canonical JSON.
            function canonicalJson(value) {
              if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`;
              if (value !== null && typeof value === 'object') {
                return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(',')}}`;
              }
              return JSON.stringify(value);
            }

            function subscriptionRequestId(identity, artifactId, artifactDigest) {
              return require('crypto')
                .createHash('sha256')
                .update(canonicalJson([identity, artifactId, artifactDigest]), 'utf8')
                .digest('hex');
            }

            function subscriptionMarkerFields(kind, identity, requestId, artifactId, artifactDigest) {
