name: Untrusted FIX

on:
  workflow_dispatch:
    inputs:
      source_review_run_id:
        description: source Trusted Rail run ID
        required: true
        type: string
      source_review_run_attempt:
        description: source REVIEW artifact actual run attempt
        required: true
        type: string
      source_review_artifact_name:
        description: exact REVIEW provenance artifact name
        required: true
        type: string
      fix_attempt:
        description: bounded FIX attempt (1 or 2)
        required: true
        type: string

permissions: {}

concurrency:
  group: fix-${{ github.repository }}-${{ inputs.source_review_run_id }}-${{ inputs.source_review_artifact_name }}-${{ inputs.fix_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    name: trusted FIX 입력 준비
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      reviewed_branch: ${{ steps.prepare.outputs.reviewed_branch }}
      reviewed_head_sha: ${{ steps.prepare.outputs.reviewed_head_sha }}
      fix_attempt: ${{ steps.prepare.outputs.fix_attempt }}

    steps:
      - name: trusted control-plane checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: source REVIEW artifact identity 확인
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_review_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_review_run_attempt }}
          SOURCE_ARTIFACT: ${{ inputs.source_review_artifact_name }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            const runAttempt = Number(process.env.SOURCE_RUN_ATTEMPT);
            const artifactName = process.env.SOURCE_ARTIFACT;
            if (!Number.isSafeInteger(runId) || runId <= 0 ||
                !Number.isSafeInteger(runAttempt) || runAttempt <= 0) {
              core.setFailed('invalid source REVIEW run identity');
              return;
            }
            const expected = new RegExp(
              `^review-provenance-issue-[1-9]\\d*-${runId}-attempt-${runAttempt}$`,
            );
            if (!expected.test(artifactName)) {
              core.setFailed(`source REVIEW artifact name does not match run identity: ${artifactName}`);
              return;
            }
            const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (sourceRun.path !== '.github/workflows/trusted-rail.yml') {
              core.setFailed(`unexpected source workflow path: ${sourceRun.path}`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = data.artifacts.filter(
              (artifact) => !artifact.expired && artifact.name === artifactName,
            );
            if (matches.length !== 1) {
              core.setFailed(`expected exactly one source REVIEW artifact; matches=${matches.length}`);
            }

      - name: source REVIEW provenance 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_review_artifact_name }}
          path: ${{ runner.temp }}/review-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_review_run_id }}

      - name: REVIEW artifact 구조 확인
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fix"
          mapfile -t review_files < <(find "${RUNNER_TEMP}/review-source" -type f -name review.json -print)
          mapfile -t all_files < <(find "${RUNNER_TEMP}/review-source" -type f -print)
          if [ "${#review_files[@]}" -ne 1 ] || [ "${#all_files[@]}" -ne 1 ]; then
            echo "REVIEW artifact must contain exactly review.json" >&2
            exit 1
          fi
          cp "${review_files[0]}" "${RUNNER_TEMP}/fix/review.json"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: trusted FIX 의존성 설치
        run: npm ci

      - name: source REVIEW 재검증 및 FIX prompt 생성
        id: prepare
        run: npm exec -- tsx src/self-improvement/fix-handler.ts prepare
        env:
          REVIEW_JSON: ${{ runner.temp }}/fix/review.json
          FIX_RUNTIME_DIR: ${{ runner.temp }}/fix
          SOURCE_REVIEW_ARTIFACT_NAME: ${{ inputs.source_review_artifact_name }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ inputs.source_review_run_attempt }}
          FIX_ATTEMPT: ${{ inputs.fix_attempt }}

      - name: FIX 시작 직전 remote reviewed HEAD exact match 확인
        uses: actions/github-script@v7
        env:
          REVIEWED_BRANCH: ${{ steps.prepare.outputs.reviewed_branch }}
          REVIEWED_HEAD_SHA: ${{ steps.prepare.outputs.reviewed_head_sha }}
        with:
          script: |
            const branch = process.env.REVIEWED_BRANCH;
            const expected = process.env.REVIEWED_HEAD_SHA;
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            if (data.object.type !== 'commit' || data.object.sha !== expected) {
              core.setFailed(`FIX base HEAD mismatch: expected=${expected}, actual=${data.object.sha}`);
            }

      - name: trusted FIX prompt artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: fix-input-${{ inputs.source_review_run_id }}-fix-${{ inputs.fix_attempt }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fix-prompt.txt
          if-no-files-found: error

  fix:
    name: untrusted FIX #${{ needs.prepare.outputs.fix_attempt }}
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""

    steps:
      - name: exact reviewed SHA checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reviewed_head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: exact FIX base SHA 확인
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.reviewed_head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: trusted prompt 다운로드
        uses: actions/download-artifact@v4
        with:
          name: fix-input-${{ inputs.source_review_run_id }}-fix-${{ inputs.fix_attempt }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fix-input

      - name: prompt를 worker workspace에 복사
        shell: bash
        run: cp "${RUNNER_TEMP}/fix-input/fix-prompt.txt" fix-prompt.txt

      - name: Untrusted Codex FIX
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: fix-prompt.txt

      - name: trusted prompt 제거
        shell: bash
        run: rm -f fix-prompt.txt

      - name: mode 보존 FIX workspace tar 생성
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./fix-prompt.txt' \
            -czf "${RUNNER_TEMP}/fix-workspace.tar.gz" .

      - name: untrusted FIX workspace snapshot 저장
        uses: actions/upload-artifact@v4
        with:
          name: fix-workspace-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fix-workspace.tar.gz
          if-no-files-found: error

  record:
    name: clean FIX candidate provenance 기록
    needs: [prepare, fix]
    if: needs.prepare.result == 'success' && needs.fix.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: exact reviewed SHA clean checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reviewed_head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: source REVIEW provenance 재다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_review_artifact_name }}
          path: ${{ runner.temp }}/review-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_review_run_id }}

      - name: REVIEW artifact clean runtime에 복사
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fix"
          mapfile -t review_files < <(find "${RUNNER_TEMP}/review-source" -type f -name review.json -print)
          mapfile -t all_files < <(find "${RUNNER_TEMP}/review-source" -type f -print)
          if [ "${#review_files[@]}" -ne 1 ] || [ "${#all_files[@]}" -ne 1 ]; then
            echo "REVIEW artifact must contain exactly review.json" >&2
            exit 1
          fi
          cp "${review_files[0]}" "${RUNNER_TEMP}/fix/review.json"

      - name: untrusted FIX workspace snapshot 다운로드
        uses: actions/download-artifact@v4
        with:
          name: fix-workspace-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-archive

      - name: mode 보존 FIX workspace tar 해제
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-workspace"
          tar -xzf "${RUNNER_TEMP}/candidate-archive/fix-workspace.tar.gz" \
            -C "${RUNNER_TEMP}/candidate-workspace"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: clean checkout 의존성 설치
        run: npm ci

      - name: clean Git metadata로 FIX candidate patch 생성
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.reviewed_head_sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate-workspace
        run: |
          set -euo pipefail
          PATCH_WORKTREE="${RUNNER_TEMP}/fix-patch-worktree"
          PATCH_FILE="${RUNNER_TEMP}/fix/candidate.patch"

          git worktree add --detach "$PATCH_WORKTREE" "$BASE_SHA"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules/' \
            "$CANDIDATE_DIR/" "$PATCH_WORKTREE/"

          : > "$PATCH_FILE"
          (
            cd "$PATCH_WORKTREE"
            export GIT_CONFIG_NOSYSTEM=1
            export GIT_CONFIG_GLOBAL=/dev/null
            unset GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_CONFIG_COUNT || true

            git -c core.hooksPath=/dev/null diff \
              --binary --full-index --no-ext-diff --no-textconv \
              "$BASE_SHA" -- . >> "$PATCH_FILE"

            while IFS= read -r -d '' file; do
              set +e
              git -c core.hooksPath=/dev/null diff \
                --no-index --binary --full-index --no-ext-diff --no-textconv \
                -- /dev/null "$file" >> "$PATCH_FILE"
              status=$?
              set -e
              if [ "$status" -gt 1 ]; then
                echo "untracked file diff failed for $file: $status" >&2
                exit "$status"
              fi
            done < <(git -c core.hooksPath=/dev/null ls-files --others -z)
          )

          if [ ! -s "$PATCH_FILE" ]; then
            echo "FIX candidate.patch is empty" >&2
            exit 1
          fi

      - name: clean code로 FIX provenance 생성
        run: npm exec -- tsx src/self-improvement/fix-handler.ts finalize
        env:
          REVIEW_JSON: ${{ runner.temp }}/fix/review.json
          FIX_RUNTIME_DIR: ${{ runner.temp }}/fix
          SOURCE_REVIEW_ARTIFACT_NAME: ${{ inputs.source_review_artifact_name }}
          SOURCE_REVIEW_RUN_ID: ${{ inputs.source_review_run_id }}
          SOURCE_REVIEW_RUN_ATTEMPT: ${{ inputs.source_review_run_attempt }}
          FIX_ATTEMPT: ${{ inputs.fix_attempt }}
          AI_RESULT_ID: codex-action-fix:${{ github.run_id }}:${{ github.run_attempt }}

      - name: FIX candidate artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: fix-candidate-${{ inputs.source_review_run_id }}-fix-${{ inputs.fix_attempt }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fix/candidate.patch
            ${{ runner.temp }}/fix/fix.json
          if-no-files-found: error
