name: Untrusted IMPLEMENT

on:
  workflow_run:
    workflows: ["Trusted AUTHORIZE"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  implement:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'issue_comment'
    runs-on: ubuntu-latest
    env:
      IMPLEMENT_RUNTIME_DIR: ${{ runner.temp }}/implement

    steps:
      - name: 승인 시점 exact SHA checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AUTHORIZE artifact 정확히 1개 선택
        id: authorization_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/authorize.yml') {
              core.setFailed(`unexpected source workflow path: ${run.path}`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const expected = new RegExp(`^authorize-approval-\\d+-attempt-${run.run_attempt}$`);
            const matches = data.artifacts.filter(
              (artifact) => !artifact.expired && expected.test(artifact.name),
            );

            if (matches.length !== 1) {
              core.setFailed(`expected exactly one AUTHORIZE artifact, found ${matches.length}`);
              return;
            }

            core.setOutput('name', matches[0].name);

      - name: AUTHORIZE artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.authorization_artifact.outputs.name }}
          path: ${{ runner.temp }}/authorize
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: AUTHORIZE artifact 구조 확인
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IMPLEMENT_RUNTIME_DIR"
          mapfile -t files < <(find "${RUNNER_TEMP}/authorize" -type f -name authorize.json -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "authorize.json must exist exactly once" >&2
            exit 1
          fi
          cp "${files[0]}" "$IMPLEMENT_RUNTIME_DIR/authorize.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: AUTHORIZE provenance 검증 및 IMPLEMENT 입력 준비
        run: npm exec -- tsx src/self-improvement/implement-handler.ts prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZE_JSON: ${{ runner.temp }}/implement/authorize.json

      - name: Untrusted Codex IMPLEMENT
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: codex-prompt.txt

      - name: candidate patch 생성
        shell: bash
        run: |
          set -euo pipefail
          rm -f codex-prompt.txt
          git add -N .
          git diff --binary --full-index -- . > "$IMPLEMENT_RUNTIME_DIR/candidate.patch"
          if [ ! -s "$IMPLEMENT_RUNTIME_DIR/candidate.patch" ]; then
            echo "candidate.patch is empty" >&2
            exit 1
          fi

      - name: IMPLEMENT provenance 생성
        run: npm exec -- tsx src/self-improvement/implement-handler.ts finalize
        env:
          AI_RESULT_ID: codex-action-run:${{ github.run_id }}:${{ github.run_attempt }}

      - name: untrusted candidate artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: implement-candidate-${{ github.event.workflow_run.id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/implement/candidate.patch
            ${{ runner.temp }}/implement/implement.json
          if-no-files-found: error
