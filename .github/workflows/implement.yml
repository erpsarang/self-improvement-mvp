name: Untrusted IMPLEMENT

on:
  workflow_run:
    workflows: ["Trusted AUTHORIZE"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  implement:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'issue_comment'
    runs-on: ubuntu-latest
    outputs:
      authorization_artifact_name: ${{ steps.authorization_artifact.outputs.name }}
      should_run: ${{ steps.authorization_artifact.outputs.should_run }}
    env:
      IMPLEMENT_RUNTIME_DIR: ${{ runner.temp }}/implement

    steps:
      - name: AUTHORIZE artifact 선택 또는 no-op 판정
        id: authorization_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/authorize.yml') {
              core.setFailed(`unexpected source workflow path: ${run.path}`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const pattern = /^authorize-approval-(\d+)-attempt-([1-9]\d*)$/;
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const match = pattern.exec(artifact.name);
                return match ? { artifact, attempt: Number(match[2]) } : null;
              })
              .filter(Boolean);

            const current = matches.filter(({ attempt }) => attempt === run.run_attempt);
            const prior = matches.filter(({ attempt }) => attempt < run.run_attempt);

            if (current.length === 1 && matches.length === 1) {
              core.setOutput('name', current[0].artifact.name);
              core.setOutput('should_run', 'true');
              return;
            }

            if (current.length === 0 && prior.length === 1 && matches.length === 1) {
              core.info(`AUTHORIZE attempt ${run.run_attempt} reused ${prior[0].artifact.name}; IMPLEMENT is a no-op`);
              core.setOutput('should_run', 'false');
              return;
            }

            if (matches.length === 0) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const authorizeJobs = jobsData.jobs.filter((job) => job.name === 'authorize');

              if (authorizeJobs.length === 1 && authorizeJobs[0].conclusion === 'skipped') {
                core.info('AUTHORIZE job was skipped; IMPLEMENT is a no-op');
                core.setOutput('should_run', 'false');
                return;
              }
            }

            core.setFailed(
              `expected one current AUTHORIZE artifact, one earlier replay artifact, or a skipped AUTHORIZE job; current=${current.length}, prior=${prior.length}, total=${matches.length}`,
            );

      - name: 승인 시점 exact SHA checkout
        if: steps.authorization_artifact.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AUTHORIZE artifact 다운로드
        if: steps.authorization_artifact.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.authorization_artifact.outputs.name }}
          path: ${{ runner.temp }}/authorize
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: AUTHORIZE artifact 구조 확인
        if: steps.authorization_artifact.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IMPLEMENT_RUNTIME_DIR"
          mapfile -t files < <(find "${RUNNER_TEMP}/authorize" -type f -name authorize.json -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "authorize.json must exist exactly once" >&2
            exit 1
          fi
          cp "${files[0]}" "$IMPLEMENT_RUNTIME_DIR/authorize.json"

      - name: Node 설정
        if: steps.authorization_artifact.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        if: steps.authorization_artifact.outputs.should_run == 'true'
        run: npm ci

      - name: AUTHORIZE provenance 검증 및 IMPLEMENT 입력 준비
        if: steps.authorization_artifact.outputs.should_run == 'true'
        run: npm exec -- tsx src/self-improvement/implement-handler.ts prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZE_JSON: ${{ runner.temp }}/implement/authorize.json

      - name: Untrusted Codex IMPLEMENT
        if: steps.authorization_artifact.outputs.should_run == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: codex-prompt.txt

      - name: trusted prompt 제거
        if: steps.authorization_artifact.outputs.should_run == 'true'
        shell: bash
        run: rm -f codex-prompt.txt

      - name: mode 보존 workspace tar 생성
        if: steps.authorization_artifact.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./codex-prompt.txt' \
            -czf "${RUNNER_TEMP}/candidate-workspace.tar.gz" .

      - name: untrusted workspace snapshot 저장
        if: steps.authorization_artifact.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: implement-workspace-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-workspace.tar.gz
          if-no-files-found: error

  record:
    name: clean IMPLEMENT provenance 기록
    needs: implement
    if: needs.implement.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      IMPLEMENT_RUNTIME_DIR: ${{ runner.temp }}/implement

    steps:
      - name: 승인 시점 exact SHA clean checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: AUTHORIZE artifact 재다운로드
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.implement.outputs.authorization_artifact_name }}
          path: ${{ runner.temp }}/authorize
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: AUTHORIZE artifact clean runtime에 복사
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IMPLEMENT_RUNTIME_DIR"
          mapfile -t files < <(find "${RUNNER_TEMP}/authorize" -type f -name authorize.json -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "authorize.json must exist exactly once" >&2
            exit 1
          fi
          cp "${files[0]}" "$IMPLEMENT_RUNTIME_DIR/authorize.json"

      - name: untrusted workspace snapshot 다운로드
        uses: actions/download-artifact@v4
        with:
          name: implement-workspace-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-archive

      - name: mode 보존 workspace tar 해제
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-workspace"
          tar -xzf "${RUNNER_TEMP}/candidate-archive/candidate-workspace.tar.gz" \
            -C "${RUNNER_TEMP}/candidate-workspace"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: clean checkout 의존성 설치
        run: npm ci

      - name: clean Git metadata로 candidate patch 생성
        shell: bash
        env:
          BASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate-workspace
        run: |
          set -euo pipefail
          PATCH_WORKTREE="${RUNNER_TEMP}/candidate-patch-worktree"
          PATCH_FILE="$IMPLEMENT_RUNTIME_DIR/candidate.patch"

          git worktree add --detach "$PATCH_WORKTREE" "$BASE_SHA"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules/' \
            "$CANDIDATE_DIR/" "$PATCH_WORKTREE/"

          : > "$PATCH_FILE"
          (
            cd "$PATCH_WORKTREE"
            export GIT_CONFIG_NOSYSTEM=1
            export GIT_CONFIG_GLOBAL=/dev/null
            unset GIT_EXTERNAL_DIFF GIT_DIFF_OPTS GIT_CONFIG_COUNT || true

            git -c core.hooksPath=/dev/null diff \
              --binary --full-index --no-ext-diff --no-textconv \
              "$BASE_SHA" -- . >> "$PATCH_FILE"

            while IFS= read -r -d '' file; do
              set +e
              git -c core.hooksPath=/dev/null diff \
                --no-index --binary --full-index --no-ext-diff --no-textconv \
                -- /dev/null "$file" >> "$PATCH_FILE"
              status=$?
              set -e
              if [ "$status" -gt 1 ]; then
                echo "untracked file diff failed for $file: $status" >&2
                exit "$status"
              fi
            done < <(git -c core.hooksPath=/dev/null ls-files --others -z)
          )

          if [ ! -s "$PATCH_FILE" ]; then
            echo "candidate.patch is empty" >&2
            exit 1
          fi

      - name: clean code로 IMPLEMENT provenance 생성
        run: npm exec -- tsx src/self-improvement/implement-handler.ts finalize
        env:
          AUTHORIZE_JSON: ${{ runner.temp }}/implement/authorize.json
          AI_RESULT_ID: codex-action-run:${{ github.run_id }}:${{ github.run_attempt }}

      - name: candidate artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: implement-candidate-${{ github.event.workflow_run.id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/implement/candidate.patch
            ${{ runner.temp }}/implement/implement.json
          if-no-files-found: error
