          SHOULD_RUN: ${{ needs.attempt0.outputs.should_run }}
          ATTEMPT0_RESULT: ${{ needs.attempt0.result }}
          RETRY_REQUIRED: ${{ needs.attempt0.outputs.retry_required }}
          RETRY_RESULT: ${{ needs.timeout_retry.result }}
          DIRECT_STATUS: ${{ needs.attempt0.outputs.ci_status }}
          DIRECT_REPAIR_READY: ${{ needs.attempt0.outputs.repair_ready }}
          DIRECT_BLOCKED_REASON: ${{ needs.attempt0.outputs.repair_blocked_reason }}
          RETRY_STATUS: ${{ needs.timeout_retry.outputs.ci_status }}
          RETRY_REPAIR_READY: ${{ needs.timeout_retry.outputs.repair_ready }}
          RETRY_BLOCKED_REASON: ${{ needs.timeout_retry.outputs.repair_blocked_reason }}
          SOURCE_NAME: ${{ needs.attempt0.outputs.source_name }}
          SOURCE_ID: ${{ needs.attempt0.outputs.source_id }}
          SOURCE_DIGEST: ${{ needs.attempt0.outputs.source_digest }}
          SOURCE_RUN_ID: ${{ needs.attempt0.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.attempt0.outputs.source_run_attempt }}
          RECOVERY_GUARD_KIND: ${{ needs.attempt0.outputs.recovery_guard_kind }}
          RECOVERY_BASE_SHA: ${{ needs.attempt0.outputs.recovery_base_sha }}
          RECOVERY_CURRENT_SHA: ${{ needs.attempt0.outputs.recovery_current_sha }}
          BASE_SHA: ${{ needs.attempt0.outputs.base_sha }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.attempt0.outputs.candidate_artifact_name }}
        run: |
          set -euo pipefail
          infrastructure_failed=false
          ci_status="$DIRECT_STATUS"
          repair_ready="$DIRECT_REPAIR_READY"
          repair_blocked_reason="$DIRECT_BLOCKED_REASON"

          if [ "$RETRY_REQUIRED" = "true" ]; then
            if [ "$RETRY_RESULT" != "success" ]; then
              infrastructure_failed=true
              ci_status=""
              repair_ready=""
              repair_blocked_reason=""
            else
              ci_status="$RETRY_STATUS"
              repair_ready="$RETRY_REPAIR_READY"
              repair_blocked_reason="$RETRY_BLOCKED_REASON"
            fi
          elif [ "$ATTEMPT0_RESULT" != "success" ]; then
            infrastructure_failed=true
            ci_status=""
            repair_ready=""
            repair_blocked_reason=""
          fi

          {
            echo "should_run=$SHOULD_RUN"
            echo "ci_status=$ci_status"
            echo "repair_ready=$repair_ready"
            echo "repair_blocked_reason=$repair_blocked_reason"
            echo "infrastructure_failed=$infrastructure_failed"
            echo "source_name=$SOURCE_NAME"
            echo "source_id=$SOURCE_ID"
            echo "source_digest=$SOURCE_DIGEST"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_run_attempt=$SOURCE_RUN_ATTEMPT"
            echo "recovery_guard_kind=$RECOVERY_GUARD_KIND"
            echo "recovery_base_sha=$RECOVERY_BASE_SHA"
            echo "recovery_current_sha=$RECOVERY_CURRENT_SHA"
            echo "base_sha=$BASE_SHA"
            echo "candidate_artifact_name=$CANDIDATE_ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"


