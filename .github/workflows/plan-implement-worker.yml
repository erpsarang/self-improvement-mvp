            cp "$RUNNER_TEMP/validated-candidate-2/candidate.json" "$RUNNER_TEMP/worker-state-2/candidate/candidate.json"
            cp "$RUNNER_TEMP/validated-candidate-2/candidate-provenance.json" "$RUNNER_TEMP/worker-state-2/candidate/candidate-provenance.json"
            cp "$RUNNER_TEMP/worker-ci-2/validation.json" "$RUNNER_TEMP/worker-state-2/evidence/validation-2.json"
          else
            # candidate 전에 edit 적용에 실패한 attempt: candidate 없이 trusted 실패 기록만 evidence로 남긴다.
            cp "$RUNNER_TEMP/worker-ci-2/edit-failure.json" "$RUNNER_TEMP/worker-state-2/evidence/edit-failure-2.json"
          fi

      - name: attempt 2 state artifact 저장
        if: steps.ci2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-worker-state-2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-state-2
          if-no-files-found: error

  finalize:
    needs: [attempt0_result, repair1, repair2]
    if: always() && needs.attempt0_result.outputs.should_run == 'true'
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: attempt 0 state 다운로드
        if: needs.attempt0_result.outputs.ci_status != ''
        uses: actions/download-artifact@v4
        with:
          name: bounded-worker-state-0-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-state-0

      - name: attempt 1 state 다운로드
        if: needs.repair1.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bounded-worker-state-1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-state-1

      - name: attempt 2 state 다운로드
        if: needs.repair2.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bounded-worker-state-2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-state-2

      - name: PASS candidate 선택
        if: >-
          needs.attempt0_result.outputs.ci_status == 'PASS' ||
          needs.repair1.outputs.ci_status == 'PASS' ||
          needs.repair2.outputs.ci_status == 'PASS'
        shell: bash
        env:
          STATUS0: ${{ needs.attempt0_result.outputs.ci_status }}
          STATUS1: ${{ needs.repair1.outputs.ci_status }}
          STATUS2: ${{ needs.repair2.outputs.ci_status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-candidate"
          if [ "$STATUS0" = "PASS" ]; then
            SOURCE="$RUNNER_TEMP/worker-state-0/candidate"
          elif [ "$STATUS1" = "PASS" ]; then
            SOURCE="$RUNNER_TEMP/worker-state-1/candidate"
          elif [ "$STATUS2" = "PASS" ]; then
            SOURCE="$RUNNER_TEMP/worker-state-2/candidate"
          else
            echo "no PASS candidate" >&2
            exit 1
          fi
          cp "$SOURCE/candidate.json" "$RUNNER_TEMP/final-candidate/candidate.json"
          cp "$SOURCE/candidate-provenance.json" "$RUNNER_TEMP/final-candidate/candidate-provenance.json"

      - name: deterministic CI evidence 정리
        if: needs.attempt0_result.outputs.ci_status != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worker-ci-evidence"
          for attempt in 0 1 2; do
            for name in validation edit-failure; do
              source="$RUNNER_TEMP/worker-state-${attempt}/evidence/${name}-${attempt}.json"
              if [ -f "$source" ]; then
                cp "$source" "$RUNNER_TEMP/worker-ci-evidence/${name}-${attempt}.json"
              fi
            done
          done

      - name: deterministic CI evidence artifact 저장
        if: needs.attempt0_result.outputs.ci_status != ''
        uses: actions/upload-artifact@v4
        with:
          name: bounded-worker-ci-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-ci-evidence/*.json
          if-no-files-found: error

      - name: out-of-scope boundary repair 차단 시 fail-closed
        if: >-
          (needs.attempt0_result.outputs.ci_status == 'FAIL' &&
           needs.attempt0_result.outputs.repair_ready == 'false') ||
          (needs.repair1.outputs.ci_status == 'FAIL' &&
           needs.repair1.outputs.repair_ready == 'false')
        shell: bash
        env:
          ATTEMPT0_REASON: ${{ needs.attempt0_result.outputs.repair_blocked_reason }}
          ATTEMPT1_REASON: ${{ needs.repair1.outputs.repair_blocked_reason }}
        run: |
          echo "AI repair blocked by deterministic repair policy: attempt0=${ATTEMPT0_REASON}, attempt1=${ATTEMPT1_REASON}" >&2
          exit 1

      - name: WORKER_INCOMPLETE stalled cycle 기록
        if: needs.attempt0_result.outputs.worker_incomplete == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_HANDOFF_RUN_ID: ${{ needs.attempt0_result.outputs.source_run_id }}
          SOURCE_HANDOFF_RUN_ATTEMPT: ${{ needs.attempt0_result.outputs.source_run_attempt }}
          SOURCE_HANDOFF_ARTIFACT: ${{ needs.attempt0_result.outputs.source_name }}
          APPROVED_BASE_SHA: ${{ needs.attempt0_result.outputs.base_sha }}
          WORKER_RUN_ID: ${{ github.run_id }}
          WORKER_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const artifact = process.env.SOURCE_HANDOFF_ARTIFACT || '';
            const match = /^plan-implement-handoff-issue-(\d+)-plan-\d+-attempt-\d+-approval-\d+$/.exec(artifact);
            if (!match) {
              core.setFailed(`cannot derive issue from Handoff artifact: ${artifact}`);
              return;
            }
            const issueNumber = Number(match[1]);
            const handoffRunId = Number(process.env.SOURCE_HANDOFF_RUN_ID);
            const handoffRunAttempt = Number(process.env.SOURCE_HANDOFF_RUN_ATTEMPT);
            const workerRunId = Number(process.env.WORKER_RUN_ID);
            const workerRunAttempt = Number(process.env.WORKER_RUN_ATTEMPT);
            const baseSha = process.env.APPROVED_BASE_SHA || '';
            if (
              ![issueNumber, handoffRunId, handoffRunAttempt, workerRunId, workerRunAttempt]
                .every((value) => Number.isSafeInteger(value) && value > 0) ||
              !/^[0-9a-f]{40,64}$/.test(baseSha)
            ) {
              core.setFailed('invalid stalled cycle identity');
              return;
            }
            const marker =
              `<!-- ai-dev-framework:STALLED_WORKER issue=${issueNumber} handoff-run=${handoffRunId} handoff-attempt=${handoffRunAttempt} artifact=${artifact} base-sha=${baseSha} worker-run=${workerRunId} worker-attempt=${workerRunAttempt} reason=WORKER_INCOMPLETE -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info('exact WORKER_INCOMPLETE marker already exists');
              return;
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: [
                marker,
                '## Worker 중단 — WORKER_INCOMPLETE',
                'AI Worker가 승인 범위 전체를 완전한 candidate로 만들지 못했다고 명시했습니다.',
                '인프라 장애가 아니므로 자동 Recovery 대상으로 분류하지 않습니다. 범위를 보완하거나 다시 PLAN/IMPLEMENT할지 사람이 판단하세요.',
              ].join('\n\n'),
            });

      - name: WORKER_INCOMPLETE 시 fail-closed
        if: needs.attempt0_result.outputs.worker_incomplete == 'true'
        shell: bash
        run: |
          echo "PLAN Worker returned complete=false; stopped as WORKER_INCOMPLETE" >&2
          exit 1

      - name: INFRA_FAILURE stalled cycle 기록
        if: needs.attempt0_result.outputs.infrastructure_failed == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_HANDOFF_RUN_ID: ${{ needs.attempt0_result.outputs.source_run_id }}
          SOURCE_HANDOFF_RUN_ATTEMPT: ${{ needs.attempt0_result.outputs.source_run_attempt }}
          SOURCE_HANDOFF_ARTIFACT: ${{ needs.attempt0_result.outputs.source_name }}
          APPROVED_BASE_SHA: ${{ needs.attempt0_result.outputs.base_sha }}
          WORKER_RUN_ID: ${{ github.run_id }}
          WORKER_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const artifact = process.env.SOURCE_HANDOFF_ARTIFACT || '';
            const match = /^plan-implement-handoff-issue-(\d+)-plan-\d+-attempt-\d+-approval-\d+$/.exec(artifact);
            if (!match) {
              core.setFailed(`cannot derive issue from Handoff artifact: ${artifact}`);
              return;
            }

            const issueNumber = Number(match[1]);
            const handoffRunId = Number(process.env.SOURCE_HANDOFF_RUN_ID);
            const handoffRunAttempt = Number(process.env.SOURCE_HANDOFF_RUN_ATTEMPT);
            const workerRunId = Number(process.env.WORKER_RUN_ID);
            const workerRunAttempt = Number(process.env.WORKER_RUN_ATTEMPT);
            const baseSha = process.env.APPROVED_BASE_SHA || '';
            if (
              ![issueNumber, handoffRunId, handoffRunAttempt, workerRunId, workerRunAttempt]
                .every((value) => Number.isSafeInteger(value) && value > 0) ||
              !/^[0-9a-f]{40,64}$/.test(baseSha)
            ) {
              core.setFailed('invalid stalled cycle identity');
              return;
            }

            const marker =
              `<!-- ai-dev-framework:STALLED_WORKER issue=${issueNumber} handoff-run=${handoffRunId} handoff-attempt=${handoffRunAttempt} artifact=${artifact} base-sha=${baseSha} worker-run=${workerRunId} worker-attempt=${workerRunAttempt} reason=INFRA_FAILURE -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) {
              core.info('exact STALLED_WORKER marker already exists');
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: [
                marker,
                '## Worker 일시 중단 — INFRA_FAILURE',
                '업무 candidate가 생성되기 전에 infrastructure failure로 중단되었습니다.',
                'Trusted Recovery Preflight가 PASS하면 Worker가 자동 재진입합니다.',
              ].join('\n\n'),
            });

      - name: upstream infrastructure failure 시 fail-closed
        if: >-
          needs.attempt0_result.outputs.infrastructure_failed == 'true' ||
          needs.repair1.result == 'failure' ||
          needs.repair2.result == 'failure'
        shell: bash
        run: |
          echo "bounded Worker attempt job failed before a trusted PASS candidate was produced" >&2
          exit 1

      - name: bounded repair 소진 시 fail-closed
        if: >-
          needs.attempt0_result.outputs.ci_status == 'FAIL' &&
          needs.repair1.outputs.ci_status == 'FAIL' &&
          needs.repair2.outputs.ci_status == 'FAIL'
        shell: bash
        run: |
          echo "deterministic CI or exact-base edit application failed after two bounded repairs" >&2
          exit 1

      - name: Validated candidate artifact 저장
        if: >-
          needs.attempt0_result.outputs.ci_status == 'PASS' ||
          needs.repair1.outputs.ci_status == 'PASS' ||
          needs.repair2.outputs.ci_status == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.attempt0_result.outputs.candidate_artifact_name }}
          path: |
            ${{ runner.temp }}/final-candidate/candidate.json
            ${{ runner.temp }}/final-candidate/candidate-provenance.json
          if-no-files-found: error
