      request_artifact_name: ${{ needs.attempt0.outputs.request_artifact_name }}
      repair_request_artifact_name: ${{ needs.attempt0.outputs.repair_request_artifact_name }}
      repair_request_artifact_id: ${{ needs.attempt0.outputs.repair_request_artifact_id }}
      repair_request_artifact_digest: ${{ needs.attempt0.outputs.repair_request_artifact_digest }}

    steps:
