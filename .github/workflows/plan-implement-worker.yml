  attempt0_result:
    needs: [attempt0, timeout_retry]
    if: always() && needs.attempt0.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.effective.outputs.should_run }}
      ci_status: ${{ steps.effective.outputs.ci_status }}
      repair_ready: ${{ steps.effective.outputs.repair_ready }}
      repair_blocked_reason: ${{ steps.effective.outputs.repair_blocked_reason }}
