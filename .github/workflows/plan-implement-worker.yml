      source_digest: ${{ steps.effective.outputs.source_digest }}
      source_run_id: ${{ steps.effective.outputs.source_run_id }}
      source_run_attempt: ${{ steps.effective.outputs.source_run_attempt }}
      recovery_guard_kind: ${{ steps.effective.outputs.recovery_guard_kind }}
      recovery_base_sha: ${{ steps.effective.outputs.recovery_base_sha }}
